<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trilhar - Show do Milhão</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
    }

    #game {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: #000;
        overflow: hidden;
    }

    #screen {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        user-select: none;
    }

    /* Áreas invisíveis clicáveis */
    .hotspot {
        position: absolute;
        cursor: pointer;
        background: transparent;
        border: none;
        outline: none;
        z-index: 10;
    }

    #playHot {
        left: 25%;
        top: 70%;
        width: 50%;
        height: 25%;
    }

    #rulesHot {
        inset: 0;
    }

    #enterHot {
        left: 69%;
        top: 20%;
        width: 25%;
        height: 18%;
    }

    #backHot {
        left: 69%;
        top: 55%;
        width: 25%;
        height: 18%;
    }

    /* Campo de nome */
    #nameBox {
        display: none;
        position: absolute;
        left: 29%;
        top: 65%;
        width: 42%;
        height: 7%;
        z-index: 20;

        border: 3px solid #fff;
        border-radius: 10px;
        background: rgba(0,0,0,0.85);

        color: #fff;
        text-align: center;
        font-size: clamp(18px, 2vw, 32px);
        font-weight: bold;
        outline: none;
    }

    /* Alternativas */
    .answer {
        display: none;
        position: absolute;
        z-index: 15;
        cursor: pointer;
        background: transparent;
        border: none;
    }

    #answerA {
        left: 7.5%;
        top: 38.8%;
        width: 43.8%;
        height: 6.5%;
    }

    #answerB {
        left: 7.5%;
        top: 47%;
        width: 43.8%;
        height: 6.5%;
    }

    #answerC {
        left: 7.5%;
        top: 55.2%;
        width: 43.8%;
        height: 6.5%;
    }

    #answerD {
        left: 7.5%;
        top: 63.3%;
        width: 43.8%;
        height: 6.5%;
    }

    #status {
        display: none;
        position: absolute;
        left: 50%;
        bottom: 2%;
        transform: translateX(-50%);
        z-index: 30;

        padding: 8px 18px;
        border-radius: 8px;

        color: #fff;
        background: rgba(0,0,0,.75);
        font-size: 14px;
    }

    @media (max-aspect-ratio: 1/1) {
        #screen {
            object-fit: contain;
        }
    }
</style>
</head>

<body>

<div id="game">

    <img id="screen" src="inicio.png" alt="Tela do jogo">

    <!-- Botões -->
    <button id="playHot" class="hotspot"></button>
    <button id="rulesHot" class="hotspot"></button>
    <button id="enterHot" class="hotspot"></button>
    <button id="backHot" class="hotspot"></button>

    <!-- Nome -->
    <input
        id="nameBox"
        type="text"
        placeholder="Digite seu nome"
        maxlength="30"
        autocomplete="off"
    >

    <!-- Alternativas -->
    <button id="answerA" class="answer"></button>
    <button id="answerB" class="answer"></button>
    <button id="answerC" class="answer"></button>
    <button id="answerD" class="answer"></button>

    <div id="status"></div>

</div>

<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const screen = document.getElementById("screen");

const playHot = document.getElementById("playHot");
const rulesHot = document.getElementById("rulesHot");
const enterHot = document.getElementById("enterHot");
const backHot = document.getElementById("backHot");

const nameBox = document.getElementById("nameBox");

const answers = [
    document.getElementById("answerA"),
    document.getElementById("answerB"),
    document.getElementById("answerC"),
    document.getElementById("answerD")
];

const statusBox = document.getElementById("status");


/* =========================================================
   ÁUDIOS
========================================================= */

const AUDIO = {

    inicio:
        "Vai comecar o show do milhao.mp3",

    participante:
        "Vamos conhecer nosso participante.mp3",

    boaSorte:
        "Boa Sorte.mp3",

    valor1:
        "1 Mil.mp3",

    valor5:
        "5 mil.mp3",

    valor10:
        "10 mil.mp3",

    valor30:
        "30 mil.mp3",

    valor50:
        "50 mil.mp3",

    valor100:
        "1000 mil.mp3",

    valor200:
        "2000 mil.mp3",

    valor400:
        "4000 mil.mp3",

    valor500:
        "5000 mil.mp3",

    valor1M:
        "1000 mil.mp3",

    suspense:
        "Música suspense de perguntas.mp3",

    certa:
        "certa resposta.mp3",

    errada:
        "Que pena vc errou.mp3",

    moeda:
        "Moeda caindo quando perde.mp3",

    final:
        "Parabens vc ganhou 1mila de reais.mp3"
};


/* =========================================================
   TELAS
========================================================= */

const VALUES = [
    "valor-1k.png",
    "valor-5k.png",
    "valor-10k.png",
    "valor-30k.png",
    "valor-50k.png",
    "valor-100k.png",
    "valor-200k.png",
    "valor-400k.png",
    "valor-500k.png",
    "valor-1m.png"
];

const QUESTIONS = [
    "pergunta-1.png",
    "pergunta-2.png",
    "pergunta-3.png",
    "pergunta-4.png",
    "pergunta-5.png",
    "pergunta-6.png",
    "pergunta-7.png",
    "pergunta-8.png",
    "pergunta-9.png",
    "pergunta-10.png"
];


/* =========================================================
   RESPOSTAS CORRETAS
========================================================= */

/*
    1 = A
    2 = B
    3 = C
    4 = D
*/

const CORRECT = [
    1,
    4,
    2,
    2,
    3,
    4,
    2,
    3,
    4,
    4
];


/* =========================================================
   ÁUDIO DE CADA VALOR
========================================================= */

const VALUE_AUDIO = [
    AUDIO.valor1,
    AUDIO.valor5,
    AUDIO.valor10,
    AUDIO.valor30,
    AUDIO.valor50,
    AUDIO.valor100,
    AUDIO.valor200,
    AUDIO.valor400,
    AUDIO.valor500,
    AUDIO.valor1M
];


/* =========================================================
   CONTROLE
========================================================= */

let currentQuestion = 0;
let currentAudio = null;
let playerName = "";


/* =========================================================
   FUNÇÕES
========================================================= */

function hideAllButtons() {

    playHot.style.display = "none";
    rulesHot.style.display = "none";
    enterHot.style.display = "none";
    backHot.style.display = "none";

    nameBox.style.display = "none";

    answers.forEach(btn => {
        btn.style.display = "none";
    });
}


function stopAudio() {

    if (currentAudio) {

        currentAudio.pause();

        currentAudio.currentTime = 0;

        currentAudio = null;
    }
}


function playAudio(file, callback) {

    stopAudio();

    if (!file) {

        if (callback) {
            callback();
        }

        return;
    }

    currentAudio = new Audio(file);

    currentAudio.preload = "auto";

    currentAudio.onended = function() {

        currentAudio = null;

        if (callback) {
            callback();
        }
    };

    currentAudio.onerror = function() {

        console.warn("Erro ao carregar áudio:", file);

        currentAudio = null;

        if (callback) {
            callback();
        }
    };

    currentAudio.play().catch(error => {

        console.warn("Não foi possível reproduzir:", file, error);

        if (callback) {
            callback();
        }

    });
}


function showScreen(file) {

    screen.src = file;
}


/* =========================================================
   INÍCIO
========================================================= */

function showStart() {

    stopAudio();

    hideAllButtons();

    showScreen("inicio.png");

    playHot.style.display = "block";
}


playHot.addEventListener("click", function() {

    hideAllButtons();

    showScreen("regras.png");

    rulesHot.style.display = "block";

});


/* =========================================================
   REGRAS
========================================================= */

rulesHot.addEventListener("click", function() {

    hideAllButtons();

    showScreen("entrar.png");

    nameBox.style.display = "block";

    enterHot.style.display = "block";

    nameBox.focus();

    playAudio(AUDIO.participante);

});


/* =========================================================
   ENTRAR
========================================================= */

enterHot.addEventListener("click", submitName);


nameBox.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        submitName();

    }

});


function submitName() {

    playerName = nameBox.value.trim();

    if (!playerName) {

        nameBox.focus();

        return;
    }

    localStorage.setItem(
        "trilhar_player_name",
        playerName
    );

    hideAllButtons();

    playAudio(
        AUDIO.boaSorte,
        function() {

            showValueScreen(0);

        }
    );

}


/* =========================================================
   TELA DE VALOR
========================================================= */

function showValueScreen(index) {

    hideAllButtons();

    stopAudio();

    currentQuestion = index;

    showScreen(
        VALUES[index]
    );

    playAudio(
        VALUE_AUDIO[index],
        function() {

            showQuestion(index);

        }
    );

}


/* =========================================================
   PERGUNTA
========================================================= */

function showQuestion(index) {

    hideAllButtons();

    showScreen(
        QUESTIONS[index]
    );

    answers.forEach(btn => {

        btn.style.display = "block";

    });

    /*
       Começa o suspense somente depois
       que a tela da pergunta aparece.
    */

    playAudio(
        AUDIO.suspense
    );

}


/* =========================================================
   RESPOSTAS
========================================================= */

answers.forEach((button, index) => {

    button.addEventListener("click", function() {

        answer(index + 1);

    });

});


function answer(selected) {

    /*
       Impede vários cliques enquanto
       a resposta está sendo processada.
    */

    answers.forEach(btn => {

        btn.style.pointerEvents = "none";

    });

    stopAudio();

    const correct =
        CORRECT[currentQuestion];


    /* =========================
       ACERTO
    ========================= */

    if (selected === correct) {

        playAudio(
            AUDIO.certa,
            function() {

                /*
                   Última pergunta
                */

                if (currentQuestion === 9) {

                    showFinal();

                    return;
                }


                /*
                   Próxima pergunta
                */

                currentQuestion++;

                showValueScreen(
                    currentQuestion
                );

            }
        );

        return;
    }


    /* =========================
       ERRO
    ========================= */

    playAudio(
        AUDIO.errada,
        function() {

            showScreen(
                "perdeu.png"
            );

            hideAllButtons();

            playAudio(
                AUDIO.moeda,
                function() {

                    /*
                       Depois de perder,
                       retorna para a MESMA pergunta.
                    */

                    showQuestion(
                        currentQuestion
                    );

                }
            );

        }
    );

}


/* =========================================================
   FINAL
========================================================= */

function showFinal() {

    stopAudio();

    hideAllButtons();

    showScreen(
        "parabenos.png"
    );

    playAudio(
        AUDIO.final
    );

}


/* =========================================================
   BOTÃO VOLTAR
========================================================= */

backHot.addEventListener("click", function() {

    stopAudio();

    showStart();

});


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

showStart();

</script>

</body>
</html>
