<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guima Show - Trilhar Visão de Dono</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #000;
    overflow: hidden;
}

/* =========================================================
   TELAS
========================================================= */

.screen {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    display: none;

    justify-content: center;
    align-items: center;

    background: #000;
}

.screen.active {
    display: flex;
}


/* =========================================================
   IMAGENS
========================================================= */

.fullImage {
    width: 100%;
    height: 100%;
    object-fit: contain;
}


/* =========================================================
   TELA INICIAL
========================================================= */

#startScreen {
    cursor: pointer;
}

#startScreen img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}


/* =========================================================
   TELA DE REGRAS
========================================================= */

#rulesScreen {
    cursor: pointer;
}

#rulesScreen img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}


/* =========================================================
   PARTICIPANTE
========================================================= */

#participantScreen {
    flex-direction: column;
    position: relative;
}

#participantScreen img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.participantControls {
    position: absolute;

    left: 50%;
    bottom: 7%;

    transform: translateX(-50%);

    display: flex;
    gap: 12px;

    z-index: 10;
}

#playerName {
    width: 400px;

    padding: 16px 20px;

    border-radius: 10px;
    border: 3px solid #fff;

    background: rgba(0,0,0,0.85);

    color: #fff;

    font-size: 22px;

    text-align: center;

    outline: none;
}

#playerName::placeholder {
    color: #ddd;
}

#enterButton {
    padding: 16px 28px;

    border: 0;
    border-radius: 10px;

    background: #00a651;

    color: #fff;

    font-size: 21px;
    font-weight: bold;

    cursor: pointer;
}

#enterButton:hover {
    background: #008f45;
}


/* =========================================================
   TELA DE VALOR
========================================================= */

#valueScreen img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}


/* =========================================================
   ÁREA DA PERGUNTA
========================================================= */

#questionScreen {
    position: absolute;
    inset: 0;

    display: none;

    justify-content: center;
    align-items: center;

    background: #000;
}

#questionScreen.active {
    display: flex;
}


/*
    O palco mantém exatamente a proporção 16:9
    da imagem original.
*/

.questionStage {

    position: relative;

    width: 100vw;
    height: 56.25vw;

    max-width: 177.777vh;
    max-height: 100vh;

    aspect-ratio: 16 / 9;

    overflow: hidden;
}

#questionImage {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;
}


/* =========================================================
   ÁREAS INVISÍVEIS SOBRE AS ALTERNATIVAS
========================================================= */

#answerHotspots {

    position: absolute;

    /*
       Posição baseada na imagem original 16:9.
       As áreas ficam sobre as alternativas
       que já estão dentro da imagem.
    */

    left: 8.2%;
    top: 37.8%;

    width: 42%;

    height: 32%;

    display: grid;

    grid-template-columns: 1fr;

    grid-template-rows:
        repeat(4, 1fr);

    gap: 4.5%;

    z-index: 20;
}


.answerHotspot {

    width: 100%;
    height: 100%;

    border: none;
    outline: none;

    background: transparent;

    cursor: pointer;

    opacity: 0;
}


/*
   Não aparece nenhuma caixa.
   O usuário enxerga somente a arte original.
*/

.answerHotspot:hover,
.answerHotspot:focus,
.answerHotspot:active {

    background: transparent;
    border: none;
    outline: none;
}


/* =========================================================
   NOME DO PARTICIPANTE
========================================================= */

#playerDisplay {

    position: absolute;

    top: 2%;

    left: 50%;

    transform: translateX(-50%);

    z-index: 100;

    padding: 8px 20px;

    background: rgba(0,0,0,0.65);

    border-radius: 10px;

    color: #fff;

    font-size: 22px;

    font-weight: bold;

    display: none;

    white-space: nowrap;
}


/* =========================================================
   RESULTADO
========================================================= */

#resultScreen {
    position: absolute;
    inset: 0;

    background: #000;

    z-index: 50;
}

#resultImage {

    width: 100%;
    height: 100%;

    object-fit: contain;
}


/* =========================================================
   BOTÃO CONTINUAR
========================================================= */

#continueButton {

    position: absolute;

    left: 50%;
    bottom: 5%;

    transform: translateX(-50%);

    padding: 15px 35px;

    border: none;
    border-radius: 10px;

    background: #00a651;

    color: white;

    font-size: 21px;
    font-weight: bold;

    cursor: pointer;

    display: none;

    z-index: 100;
}

#continueButton:hover {
    background: #008f45;
}


/* =========================================================
   RESPONSIVO
========================================================= */

@media (max-width: 800px) {

    .participantControls {

        width: 90%;

        flex-direction: column;

        align-items: center;

        bottom: 5%;
    }

    #playerName {

        width: 100%;

        font-size: 18px;
    }

    #enterButton {

        width: 100%;

        font-size: 18px;
    }

    #playerDisplay {

        font-size: 16px;

        max-width: 90%;

        overflow: hidden;

        text-overflow: ellipsis;
    }

}

</style>
</head>


<body>

<div id="game">


    <!-- =====================================================
         TELA INICIAL
    ====================================================== -->

    <div
        id="startScreen"
        class="screen active"
    >

        <img
            src="inicio.png"
            alt="Início"
        >

    </div>


    <!-- =====================================================
         REGRAS
    ====================================================== -->

    <div
        id="rulesScreen"
        class="screen"
    >

        <img
            src="regras.png"
            alt="Regras"
        >

    </div>


    <!-- =====================================================
         PARTICIPANTE
    ====================================================== -->

    <div
        id="participantScreen"
        class="screen"
    >

        <img
            src="tela1.png"
            alt="Participante"
        >

        <div class="participantControls">

            <input
                id="playerName"
                type="text"
                maxlength="30"
                placeholder="Digite seu nome"
                autocomplete="off"
            >

            <button id="enterButton">
                ENTRAR
            </button>

        </div>

    </div>


    <!-- =====================================================
         VALOR
    ====================================================== -->

    <div
        id="valueScreen"
        class="screen"
    >

        <img
            id="valueImage"
            src=""
            alt="Valor"
        >

    </div>


    <!-- =====================================================
         PERGUNTA
    ====================================================== -->

    <div
        id="questionScreen"
        class="screen"
    >

        <div class="questionStage">

            <img
                id="questionImage"
                src=""
                alt="Pergunta"
            >


            <!--
                ÁREAS INVISÍVEIS DE CLIQUE.
                NÃO APARECEM NA TELA.
            -->

            <div id="answerHotspots">

                <button
                    class="answerHotspot"
                    data-answer="1"
                    aria-label="Resposta 1"
                ></button>

                <button
                    class="answerHotspot"
                    data-answer="2"
                    aria-label="Resposta 2"
                ></button>

                <button
                    class="answerHotspot"
                    data-answer="3"
                    aria-label="Resposta 3"
                ></button>

                <button
                    class="answerHotspot"
                    data-answer="4"
                    aria-label="Resposta 4"
                ></button>

            </div>

        </div>

    </div>


    <!-- =====================================================
         RESULTADO
    ====================================================== -->

    <div
        id="resultScreen"
        class="screen"
    >

        <img
            id="resultImage"
            src=""
            alt="Resultado"
        >

        <button id="continueButton">
            VOLTAR À PERGUNTA
        </button>

    </div>


    <!-- =====================================================
         PARTICIPANTE NO TOPO
    ====================================================== -->

    <div id="playerDisplay"></div>


</div>


<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const BASE = "./";


/* =========================================================
   ÁUDIO ATUAL
========================================================= */

let currentAudio = null;


/* =========================================================
   PARAR ÁUDIO
========================================================= */

function stopAudio() {

    if (currentAudio) {

        try {

            currentAudio.pause();

            currentAudio.currentTime = 0;

        } catch (error) {

            console.log(error);

        }

        currentAudio = null;
    }
}


/* =========================================================
   TOCAR ÁUDIO
========================================================= */

function playAudio(file, callback = null) {

    stopAudio();

    const audio = new Audio();

    /*
       encodeURI preserva o nome do arquivo
       e transforma espaços/acentos corretamente.
    */

    audio.src =
        BASE + encodeURI(file);

    audio.preload = "auto";

    currentAudio = audio;


    audio.addEventListener(
        "ended",
        function() {

            if (currentAudio === audio) {

                currentAudio = null;

            }

            if (callback) {

                callback();

            }

        }
    );


    audio.addEventListener(
        "error",
        function() {

            console.error(
                "NÃO FOI POSSÍVEL CARREGAR O ÁUDIO:",
                file
            );

            console.error(
                "CAMINHO:",
                audio.src
            );


            /*
               Mesmo se o áudio não carregar,
               o jogo continua.
            */

            if (callback) {

                callback();

            }

        }
    );


    const promise = audio.play();


    if (promise !== undefined) {

        promise.catch(function(error) {

            console.error(
                "ERRO AO TOCAR ÁUDIO:",
                file,
                error
            );

        });

    }


    return audio;
}


/* =========================================================
   PERGUNTAS
========================================================= */

const questions = [

    {
        image: "pergunta-1.png",
        correct: 1,
        valueImage: "valor-1k.png",
        valueAudio: "1 Mil.mp3"
    },

    {
        image: "pergunta-2.png",
        correct: 4,
        valueImage: "valor-10k.png",
        valueAudio: "10 mil.mp3"
    },

    {
        image: "pergunta-3.png",
        correct: 2,
        valueImage: "valor-30k.png",
        valueAudio: "30 mil.mp3"
    },

    {
        image: "pergunta-4.png",
        correct: 2,
        valueImage: "valor-50k.png",
        valueAudio: "50 mil.mp3"
    },

    {
        image: "pergunta-5.png",
        correct: 3,
        valueImage: "valor-100k.png",
        valueAudio: "1000 mil.mp3"
    },

    {
        image: "pergunta-6.png",
        correct: 4,
        valueImage: "valor-200k.png",
        valueAudio: "2000 mil.mp3"
    },

    {
        image: "pergunta-7.png",
        correct: 2,
        valueImage: "valor-400k.png",
        valueAudio: "4000 mil.mp3"
    },

    {
        image: "pergunta-8.png",
        correct: 3,
        valueImage: "valor-500k.png",
        valueAudio: "5000 mil.mp3"
    },

    {
        image: "pergunta-9.png",
        correct: 4,
        valueImage: "valor-1m.png",
        valueAudio: null
    },

    {
        image: "pergunta-10.png",
        correct: 4,
        valueImage: "valor-1m.png",
        valueAudio: null
    }

];


/* =========================================================
   ESTADO
========================================================= */

let currentQuestion = 0;

let playerName = "";

let waitingForAnswer = false;


/* =========================================================
   ELEMENTOS
========================================================= */

const startScreen =
    document.getElementById(
        "startScreen"
    );

const rulesScreen =
    document.getElementById(
        "rulesScreen"
    );

const participantScreen =
    document.getElementById(
        "participantScreen"
    );

const valueScreen =
    document.getElementById(
        "valueScreen"
    );

const questionScreen =
    document.getElementById(
        "questionScreen"
    );

const resultScreen =
    document.getElementById(
        "resultScreen"
    );

const playerNameInput =
    document.getElementById(
        "playerName"
    );

const enterButton =
    document.getElementById(
        "enterButton"
    );

const valueImage =
    document.getElementById(
        "valueImage"
    );

const questionImage =
    document.getElementById(
        "questionImage"
    );

const resultImage =
    document.getElementById(
        "resultImage"
    );

const continueButton =
    document.getElementById(
        "continueButton"
    );

const playerDisplay =
    document.getElementById(
        "playerDisplay"
    );

const answerHotspots =
    document.querySelectorAll(
        ".answerHotspot"
    );


/* =========================================================
   TROCAR TELA
========================================================= */

function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(function(screen) {

            screen.classList.remove(
                "active"
            );

        });


    document
        .getElementById(id)
        .classList.add("active");
}


/* =========================================================
   TELA INICIAL
========================================================= */

startScreen.addEventListener(
    "click",
    function() {

        /*
           AGORA A MÚSICA INICIAL É TOCADA
           PELO CLIQUE DO USUÁRIO.
        */

        playAudio(
            "Vai comecar o show do milhao.mp3"
        );


        /*
           Mostra as regras.
        */

        showScreen(
            "rulesScreen"
        );

    }
);


/* =========================================================
   REGRAS
========================================================= */

rulesScreen.addEventListener(
    "click",
    function() {

        playAudio(
            "Vamos conhecer nosso participante.mp3"
        );


        showScreen(
            "participantScreen"
        );

    }
);


/* =========================================================
   ENTRAR
========================================================= */

enterButton.addEventListener(
    "click",
    startGame
);


playerNameInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            startGame();

        }

    }
);


/* =========================================================
   COMEÇAR JOGO
========================================================= */

function startGame() {

    const name =
        playerNameInput.value.trim();


    if (!name) {

        alert(
            "Digite seu nome para continuar."
        );

        playerNameInput.focus();

        return;

    }


    playerName = name;


    playerDisplay.textContent =
        "Participante: " +
        playerName;


    playerDisplay.style.display =
        "block";


    stopAudio();


    /*
       Boa Sorte.
    */

    playAudio(
        "Boa Sorte.mp3",
        function() {

            currentQuestion = 0;

            showValue();

        }
    );

}


/* =========================================================
   MOSTRAR VALOR
========================================================= */

function showValue() {

    const question =
        questions[currentQuestion];


    stopAudio();


    valueImage.src =
        BASE +
        encodeURI(
            question.valueImage
        );


    showScreen(
        "valueScreen"
    );


    /*
       Última pergunta:
       não existe áudio de valor
       na lista fornecida.
    */

    if (
        question.valueAudio
    ) {

        playAudio(
            question.valueAudio,
            function() {

                showQuestion();

            }
        );

    } else {

        setTimeout(
            function() {

                showQuestion();

            },
            1000
        );

    }

}


/* =========================================================
   MOSTRAR PERGUNTA
========================================================= */

function showQuestion() {

    const question =
        questions[currentQuestion];


    stopAudio();


    questionImage.src =
        BASE +
        encodeURI(
            question.image
        );


    showScreen(
        "questionScreen"
    );


    waitingForAnswer = true;


    answerHotspots.forEach(
        function(button) {

            button.disabled = false;

        }
    );


    /*
       Música de suspense.
    */

    playAudio(
        "Música suspense de perguntas.mp3"
    );

}


/* =========================================================
   CLICAR NA ALTERNATIVA
========================================================= */

answerHotspots.forEach(
    function(button) {

        button.addEventListener(
            "click",
            function() {

                if (
                    !waitingForAnswer
                ) {

                    return;

                }


                waitingForAnswer = false;


                answerHotspots.forEach(
                    function(btn) {

                        btn.disabled = true;

                    }
                );


                const selected =
                    Number(
                        this.dataset.answer
                    );


                const correct =
                    questions[
                        currentQuestion
                    ].correct;


                stopAudio();


                if (
                    selected === correct
                ) {

                    correctAnswer();

                } else {

                    wrongAnswer();

                }

            }
        );

    }
);


/* =========================================================
   RESPOSTA CERTA
========================================================= */

function correctAnswer() {

    stopAudio();


    playAudio(
        "certa resposta.mp3",
        function() {

            /*
               Se for a última pergunta,
               vai direto para o parabéns.
            */

            if (
                currentQuestion ===
                questions.length - 1
            ) {

                showFinalWin();

                return;

            }


            currentQuestion++;


            showValue();

        }
    );

}


/* =========================================================
   RESPOSTA ERRADA
========================================================= */

function wrongAnswer() {

    stopAudio();


    playAudio(
        "Que pena vc errou.mp3",
        function() {

            showLostScreen();

        }
    );

}


/* =========================================================
   PERDEU
========================================================= */

function showLostScreen() {

    stopAudio();


    /*
       Caso exista perdeu.png,
       ele será exibido.
    */

    resultImage.src =
        BASE +
        "perdeu.png";


    continueButton.style.display =
        "block";


    continueButton.textContent =
        "VOLTAR À PERGUNTA";


    showScreen(
        "resultScreen"
    );


    playAudio(
        "Moeda caindo quando perde.mp3"
    );

}


/* =========================================================
   VOLTAR PARA A MESMA PERGUNTA
========================================================= */

continueButton.addEventListener(
    "click",
    function() {

        continueButton.style.display =
            "none";


        showQuestion();

    }
);


/* =========================================================
   FINAL
========================================================= */

function showFinalWin() {

    stopAudio();


    resultImage.src =
        BASE +
        "parabenos.png";


    continueButton.style.display =
        "none";


    showScreen(
        "resultScreen"
    );


    playAudio(
        "Parabens vc ganhou 1mila de reais.mp3"
    );

}


/* =========================================================
   PRÉ-CARREGAR IMAGENS
========================================================= */

questions.forEach(
    function(question) {

        const image =
            new Image();

        image.src =
            BASE +
            encodeURI(
                question.image
            );

    }
);


/* =========================================================
   LOG
========================================================= */

console.log(
    "GUIMA SHOW - TRILHAR"
);

console.log(
    "Jogo carregado com sucesso."
);

console.log(
    "Total de perguntas:",
    questions.length
);

</script>

</body>
</html>
