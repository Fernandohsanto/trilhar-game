<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trilhar - Visão de Dono</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #000;
    overflow: hidden;
}

.screen {
    position: absolute;
    inset: 0;
    display: none;
    width: 100%;
    height: 100%;
}

.screen.active {
    display: flex;
}

.screen img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* =========================
   TELA INICIAL
========================= */

#startScreen {
    justify-content: center;
    align-items: center;
    cursor: pointer;
}

#startScreen img {
    object-fit: cover;
}

/* =========================
   REGRAS
========================= */

#rulesScreen {
    justify-content: center;
    align-items: center;
    cursor: pointer;
}

/* =========================
   PARTICIPANTE
========================= */

#participantScreen {
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: #000;
}

.participantBox {
    position: absolute;
    width: min(700px, 85vw);
    text-align: center;
}

.participantBox img {
    width: 100%;
    max-height: 65vh;
    object-fit: contain;
}

.nameArea {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 12px;
}

#playerName {
    width: min(450px, 70vw);
    padding: 18px 20px;
    border-radius: 12px;
    border: 3px solid #fff;
    font-size: 25px;
    text-align: center;
    outline: none;
}

#enterButton {
    padding: 18px 30px;
    border: 0;
    border-radius: 12px;
    background: #00a651;
    color: white;
    font-size: 23px;
    font-weight: bold;
    cursor: pointer;
}

#enterButton:hover {
    background: #008c45;
}

/* =========================
   VALOR
========================= */

#valueScreen {
    justify-content: center;
    align-items: center;
    cursor: pointer;
}

/* =========================
   PERGUNTA
========================= */

#questionScreen {
    justify-content: center;
    align-items: center;
    cursor: pointer;
}

#questionImage {
    object-fit: contain;
}

/* =========================
   RESULTADO
========================= */

#resultScreen {
    justify-content: center;
    align-items: center;
}

#resultImage {
    object-fit: contain;
}

/* =========================
   BOTÕES DE RESPOSTA
========================= */

#answers {
    position: absolute;
    left: 50%;
    bottom: 7%;
    transform: translateX(-50%);
    width: min(1000px, 90vw);

    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.answer {
    min-height: 75px;
    padding: 15px 25px;

    border: 3px solid #fff;
    border-radius: 18px;

    background: rgba(0,0,0,0.75);
    color: #fff;

    font-size: 23px;
    font-weight: bold;

    cursor: pointer;
    transition: 0.2s;
}

.answer:hover {
    background: rgba(0,166,81,0.85);
    transform: scale(1.02);
}

.answer.correct {
    background: #00a651;
}

.answer.wrong {
    background: #d00000;
}

/* =========================
   CONTROLES
========================= */

#continueButton {
    position: absolute;
    left: 50%;
    bottom: 4%;
    transform: translateX(-50%);

    display: none;

    padding: 16px 35px;

    border: 0;
    border-radius: 12px;

    background: #00a651;
    color: white;

    font-size: 22px;
    font-weight: bold;

    cursor: pointer;
}

#continueButton:hover {
    background: #008c45;
}

/* =========================
   PARTICIPANTE
========================= */

#playerDisplay {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);

    z-index: 20;

    padding: 10px 25px;

    background: rgba(0,0,0,0.7);
    border-radius: 10px;

    color: white;

    font-size: 24px;
    font-weight: bold;

    display: none;
}

/* =========================
   RESPONSIVO
========================= */

@media (max-width: 800px) {

    #answers {
        width: 92vw;
        gap: 10px;
        bottom: 3%;
    }

    .answer {
        min-height: 60px;
        padding: 10px;
        font-size: 16px;
        border-radius: 12px;
    }

    .nameArea {
        flex-direction: column;
        align-items: center;
    }

    #playerName {
        width: 85vw;
        font-size: 20px;
    }

    #enterButton {
        width: 85vw;
        font-size: 20px;
    }
}
</style>
</head>

<body>

<div id="game">

    <!-- =========================
         TELA INICIAL
    ========================== -->

    <div id="startScreen" class="screen active">
        <img src="inicio.png" alt="Início">
    </div>


    <!-- =========================
         REGRAS
    ========================== -->

    <div id="rulesScreen" class="screen">
        <img src="regras.png" alt="Regras">
    </div>


    <!-- =========================
         PARTICIPANTE
    ========================== -->

    <div id="participantScreen" class="screen">

        <div class="participantBox">

            <img src="tela1.png" alt="Participante">

            <div class="nameArea">

                <input
                    id="playerName"
                    type="text"
                    placeholder="Digite seu nome"
                    maxlength="30"
                >

                <button id="enterButton">
                    ENTRAR
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         TELA DE VALOR
    ========================== -->

    <div id="valueScreen" class="screen">

        <img id="valueImage" src="" alt="Valor">

    </div>


    <!-- =========================
         TELA DE PERGUNTA
    ========================== -->

    <div id="questionScreen" class="screen">

        <img
            id="questionImage"
            src=""
            alt="Pergunta"
        >

        <div id="answers">

            <button class="answer" data-answer="1"></button>
            <button class="answer" data-answer="2"></button>
            <button class="answer" data-answer="3"></button>
            <button class="answer" data-answer="4"></button>

        </div>

    </div>


    <!-- =========================
         TELA DE RESULTADO
    ========================== -->

    <div id="resultScreen" class="screen">

        <img
            id="resultImage"
            src=""
            alt="Resultado"
        >

        <button id="continueButton">
            CONTINUAR
        </button>

    </div>


    <div id="playerDisplay"></div>

</div>


<script>

/* ============================================================
   CONFIGURAÇÃO
============================================================ */

const BASE = "./";


/* ============================================================
   FUNÇÃO PARA TROCAR DE TELA
============================================================ */

function showScreen(id) {

    document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");
}


/* ============================================================
   ÁUDIO
============================================================ */

let currentAudio = null;

function stopAudio() {

    if (currentAudio) {

        try {
            currentAudio.pause();
            currentAudio.currentTime = 0;
        } catch (e) {}

        currentAudio = null;
    }
}


function playAudio(file, callback = null) {

    stopAudio();

    const audio = new Audio();

    audio.preload = "auto";

    audio.src = BASE + encodeURIComponent(file);

    currentAudio = audio;

    audio.onended = function() {

        if (currentAudio === audio) {
            currentAudio = null;
        }

        if (callback) {
            callback();
        }
    };

    audio.onerror = function() {

        console.error(
            "Erro ao carregar áudio:",
            file,
            audio.src
        );

        if (callback) {
            callback();
        }
    };

    const promise = audio.play();

    if (promise !== undefined) {

        promise.catch(error => {

            console.error(
                "O navegador bloqueou o áudio:",
                error
            );

        });

    }

    return audio;
}


/* ============================================================
   DADOS DAS PERGUNTAS
============================================================ */

const questions = [

    {
        image: "pergunta-1.png",
        correct: 1,
        valueImage: "valor-1k.png",
        valueAudio: "1 Mil.mp3"
    },

    {
        image: "pergunta-2.png",
        correct: 4,
        valueImage: "valor-10k.png",
        valueAudio: "10 mil.mp3"
    },

    {
        image: "pergunta-3.png",
        correct: 2,
        valueImage: "valor-30k.png",
        valueAudio: "30 mil.mp3"
    },

    {
        image: "pergunta-4.png",
        correct: 2,
        valueImage: "valor-50k.png",
        valueAudio: "50 mil.mp3"
    },

    {
        image: "pergunta-5.png",
        correct: 3,
        valueImage: "valor-100k.png",
        valueAudio: "1000 mil.mp3"
    },

    {
        image: "pergunta-6.png",
        correct: 4,
        valueImage: "valor-200k.png",
        valueAudio: "2000 mil.mp3"
    },

    {
        image: "pergunta-7.png",
        correct: 2,
        valueImage: "valor-400k.png",
        valueAudio: "4000 mil.mp3"
    },

    {
        image: "pergunta-8.png",
        correct: 3,
        valueImage: "valor-500k.png",
        valueAudio: "5000 mil.mp3"
    },

    {
        image: "pergunta-9.png",
        correct: 4,
        valueImage: "valor-1m.png",
        valueAudio: null
    },

    {
        image: "pergunta-10.png",
        correct: 4,
        valueImage: "valor-1m.png",
        valueAudio: null
    }

];


/* ============================================================
   ESTADO DO JOGO
============================================================ */

let currentQuestion = 0;

let playerName = "";

let waitingForAnswer = false;


/* ============================================================
   ELEMENTOS
============================================================ */

const startScreen =
    document.getElementById("startScreen");

const rulesScreen =
    document.getElementById("rulesScreen");

const participantScreen =
    document.getElementById("participantScreen");

const valueScreen =
    document.getElementById("valueScreen");

const questionScreen =
    document.getElementById("questionScreen");

const resultScreen =
    document.getElementById("resultScreen");

const playerNameInput =
    document.getElementById("playerName");

const enterButton =
    document.getElementById("enterButton");

const valueImage =
    document.getElementById("valueImage");

const questionImage =
    document.getElementById("questionImage");

const resultImage =
    document.getElementById("resultImage");

const continueButton =
    document.getElementById("continueButton");

const playerDisplay =
    document.getElementById("playerDisplay");

const answerButtons =
    document.querySelectorAll(".answer");


/* ============================================================
   INÍCIO
============================================================ */

startScreen.addEventListener("click", function() {

    stopAudio();

    showScreen("rulesScreen");

});


/* ============================================================
   REGRAS
============================================================ */

rulesScreen.addEventListener("click", function() {

    showScreen("participantScreen");

    playAudio(
        "Vamos conhecer nosso participante.mp3"
    );

});


/* ============================================================
   ENTRAR
============================================================ */

enterButton.addEventListener("click", startGame);


playerNameInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        startGame();
    }

});


function startGame() {

    const name =
        playerNameInput.value.trim();

    if (!name) {

        alert("Digite seu nome para continuar.");

        playerNameInput.focus();

        return;
    }

    playerName = name;

    playerDisplay.textContent =
        "Participante: " + playerName;

    playerDisplay.style.display = "block";

    stopAudio();

    playAudio(
        "Boa Sorte.mp3",
        function() {

            currentQuestion = 0;

            showValue();

        }
    );

}


/* ============================================================
   MOSTRAR VALOR
============================================================ */

function showValue() {

    const question =
        questions[currentQuestion];

    stopAudio();

    valueImage.src =
        BASE + encodeURIComponent(question.valueImage);

    showScreen("valueScreen");

    if (question.valueAudio) {

        playAudio(
            question.valueAudio,
            function() {

                showQuestion();

            }
        );

    } else {

        setTimeout(function() {

            showQuestion();

        }, 1000);

    }

}


/* ============================================================
   MOSTRAR PERGUNTA
============================================================ */

function showQuestion() {

    const question =
        questions[currentQuestion];

    stopAudio();

    questionImage.src =
        BASE + encodeURIComponent(question.image);

    showScreen("questionScreen");

    waitingForAnswer = true;

    answerButtons.forEach(button => {

        button.disabled = false;

        button.classList.remove(
            "correct",
            "wrong"
        );

    });

    playAudio(
        "Música suspense de perguntas.mp3"
    );

}


/* ============================================================
   RESPOSTAS
============================================================ */

answerButtons.forEach(button => {

    button.addEventListener("click", function() {

        if (!waitingForAnswer) {
            return;
        }

        waitingForAnswer = false;

        answerButtons.forEach(btn => {
            btn.disabled = true;
        });

        const selected =
            Number(this.dataset.answer);

        const correct =
            questions[currentQuestion].correct;

        stopAudio();

        if (selected === correct) {

            this.classList.add("correct");

            correctAnswer();

        } else {

            this.classList.add("wrong");

            wrongAnswer();

        }

    });

});


/* ============================================================
   RESPOSTA CERTA
============================================================ */

function correctAnswer() {

    stopAudio();

    playAudio(
        "certa resposta.mp3",
        function() {

            if (currentQuestion === questions.length - 1) {

                showFinalWin();

                return;
            }

            currentQuestion++;

            showValue();

        }
    );

}


/* ============================================================
   RESPOSTA ERRADA
============================================================ */

function wrongAnswer() {

    stopAudio();

    playAudio(
        "Que pena vc errou.mp3",
        function() {

            showLostScreen();

        }
    );

}


/* ============================================================
   PERDEU
============================================================ */

function showLostScreen() {

    stopAudio();

    resultImage.src =
        BASE + "perdeu.png";

    continueButton.style.display =
        "block";

    continueButton.textContent =
        "VOLTAR À PERGUNTA";

    showScreen("resultScreen");

    playAudio(
        "Moeda caindo quando perde.mp3"
    );

}


/* ============================================================
   VOLTAR PARA A MESMA PERGUNTA
============================================================ */

continueButton.addEventListener("click", function() {

    continueButton.style.display =
        "none";

    showQuestion();

});


/* ============================================================
   FINAL
============================================================ */

function showFinalWin() {

    stopAudio();

    resultImage.src =
        BASE + "parabenos.png";

    continueButton.style.display =
        "none";

    showScreen("resultScreen");

    playAudio(
        "Parabens vc ganhou 1mila de reais.mp3"
    );

}


/* ============================================================
   EVITA MENU DE CONTEXTO
============================================================ */

document.addEventListener(
    "contextmenu",
    function(event) {
        event.preventDefault();
    }
);


/* ============================================================
   PRÉ-CARREGAMENTO DAS IMAGENS
============================================================ */

questions.forEach(question => {

    const img =
        new Image();

    img.src =
        BASE +
        encodeURIComponent(question.image);

});


/* ============================================================
   LOG
============================================================ */

console.log(
    "Trilhar Game carregado."
);

console.log(
    "Perguntas:",
    questions.length
);

</script>

</body>
</html>
