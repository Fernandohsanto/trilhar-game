<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guima Show</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#000;
}

#screen{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
}

.hotspot{
    position:absolute;
    border:0;
    background:transparent;
    cursor:pointer;
    z-index:20;
}

#playHot{
    left:25%;
    top:70%;
    width:50%;
    height:25%;
}

#rulesHot{
    left:0;
    top:0;
    width:100%;
    height:100%;
}

#enterHot{
    left:69%;
    top:20%;
    width:25%;
    height:18%;
}

#nameBox{
    display:none;
    position:absolute;
    left:29%;
    top:65%;
    width:42%;
    height:7%;
    z-index:30;

    background:rgba(0,0,0,.85);
    border:3px solid white;
    border-radius:10px;

    color:white;
    text-align:center;
    font-size:clamp(18px,2vw,32px);
    font-weight:bold;
    outline:none;
}

.answer{
    display:none;
    position:absolute;
    z-index:30;
    border:0;
    background:transparent;
    cursor:pointer;
}

#answerA{
    left:7.5%;
    top:38.8%;
    width:43.8%;
    height:6.5%;
}

#answerB{
    left:7.5%;
    top:47%;
    width:43.8%;
    height:6.5%;
}

#answerC{
    left:7.5%;
    top:55.2%;
    width:43.8%;
    height:6.5%;
}

#answerD{
    left:7.5%;
    top:63.3%;
    width:43.8%;
    height:6.5%;
}

#audioError{
    display:none;
    position:absolute;
    left:50%;
    bottom:15px;
    transform:translateX(-50%);
    z-index:100;

    background:#b00000;
    color:#fff;

    padding:10px 18px;
    border-radius:8px;

    font-family:Arial;
    font-size:14px;
    text-align:center;
}
</style>
</head>

<body>

<div id="game">

    <img id="screen" src="inicio.png">

    <button id="playHot" class="hotspot"></button>

    <button id="rulesHot" class="hotspot"></button>

    <button id="enterHot" class="hotspot"></button>

    <input
        id="nameBox"
        type="text"
        maxlength="30"
        placeholder="Digite seu nome"
        autocomplete="off"
    >

    <button id="answerA" class="answer"></button>
    <button id="answerB" class="answer"></button>
    <button id="answerC" class="answer"></button>
    <button id="answerD" class="answer"></button>

    <div id="audioError"></div>

</div>

<script>

/* =========================================================
   ELEMENTOS
========================================================= */

const screen =
    document.getElementById("screen");

const playHot =
    document.getElementById("playHot");

const rulesHot =
    document.getElementById("rulesHot");

const enterHot =
    document.getElementById("enterHot");

const nameBox =
    document.getElementById("nameBox");

const answerButtons = [
    document.getElementById("answerA"),
    document.getElementById("answerB"),
    document.getElementById("answerC"),
    document.getElementById("answerD")
];

const audioError =
    document.getElementById("audioError");


/* =========================================================
   NOMES EXATOS DOS ARQUIVOS DO GITHUB
========================================================= */

const AUDIO = {

    inicio:
        "Vai come├ºar o show do milh├úo.mp3",

    participante:
        "Vamos conhecer o nosso participante .mp3",

    boaSorte:
        "Boa Sorte.mp3",

    valor1:
        "1 Mil.mp3",

    valor5:
        "5 mil.mp3",

    valor10:
        "10 mil.mp3",

    valor30:
        "30 mil.mp3",

    valor50:
        "50 mil(1).mp3",

    valor100:
        "1000 mil.mp3",

    valor200:
        "2000 mil.mp3",

    valor400:
        "4000 mil.mp3",

    valor500:
        "5000 mil.mp3",

    valor1M:
        "1 milh├úo.mp3",

    suspense:
        "Musica suspense de perguntas.mp3",

    certa:
        "certa resposta.mp3",

    errada:
        "Que pena vc errou.mp3",

    moeda:
        "Moeda caindo quando perde.mp3",

    final:
        "Parab├®ns vc ganhou 1milh├úo de reais.mp3"
};


/* =========================================================
   IMAGENS
========================================================= */

const VALUES = [

    "valor-1k.png",
    "valor-5k.png",
    "valor-10k.png",
    "valor-30k.png",
    "valor-50k.png",
    "valor-100k.png",
    "valor-200k.png",
    "valor-400k.png",
    "valor-500k.png",
    "valor-1m.png"

];


const QUESTIONS = [

    "pergunta-1.png",
    "pergunta-2.png",
    "pergunta-3.png",
    "pergunta-4.png",
    "pergunta-5.png",
    "pergunta-6.png",
    "pergunta-7.png",
    "pergunta-8.png",
    "pergunta-9.png",
    "pergunta-10.png"

];


/* =========================================================
   ÁUDIO DOS VALORES
========================================================= */

const VALUE_AUDIO = [

    AUDIO.valor1,
    AUDIO.valor5,
    AUDIO.valor10,
    AUDIO.valor30,
    AUDIO.valor50,
    AUDIO.valor100,
    AUDIO.valor200,
    AUDIO.valor400,
    AUDIO.valor500,
    AUDIO.valor1M

];


/* =========================================================
   RESPOSTAS CORRETAS
=========================================================

   A = 1
   B = 2
   C = 3
   D = 4

========================================================= */

const CORRECT = [

    1,
    4,
    2,
    2,
    3,
    4,
    2,
    3,
    4,
    4

];


/* =========================================================
   CONTROLE
========================================================= */

let currentQuestion = 0;

let currentAudio = null;

let answering = false;


/* =========================================================
   ESCONDER BOTÕES
========================================================= */

function hideAll(){

    playHot.style.display = "none";

    rulesHot.style.display = "none";

    enterHot.style.display = "none";

    nameBox.style.display = "none";

    answerButtons.forEach(function(button){

        button.style.display = "none";
        button.style.pointerEvents = "none";

    });

}


/* =========================================================
   PARAR ÁUDIO
========================================================= */

function stopAudio(){

    if(currentAudio){

        currentAudio.pause();

        currentAudio.currentTime = 0;

        currentAudio = null;

    }

}


/* =========================================================
   ERRO DE ÁUDIO
========================================================= */

function showAudioError(file){

    audioError.innerText =
        "Erro ao carregar: " + file;

    audioError.style.display = "block";

}


function hideAudioError(){

    audioError.style.display = "none";

}


/* =========================================================
   TOCAR ÁUDIO
========================================================= */

function playAudio(file, callback){

    stopAudio();

    hideAudioError();

    console.log("Áudio:", file);

    const audio =
        new Audio();

    currentAudio = audio;

    /*
       encodeURI transforma espaços e caracteres
       especiais no formato correto para a URL.
    */

    audio.src =
        encodeURI(file);

    audio.preload =
        "auto";

    audio.onended =
        function(){

            currentAudio = null;

            if(callback){

                callback();

            }

        };


    audio.onerror =
        function(){

            console.error(
                "Erro no áudio:",
                file
            );

            currentAudio = null;

            showAudioError(file);

        };


    audio.play()
        .catch(function(error){

            console.error(
                "Erro ao tocar:",
                error
            );

            showAudioError(file);

        });

}


/* =========================================================
   TROCAR IMAGEM
========================================================= */

function showScreen(file){

    screen.src = file;

}


/* =========================================================
   INÍCIO
========================================================= */

function showStart(){

    stopAudio();

    hideAll();

    hideAudioError();

    showScreen(
        "inicio.png"
    );

    playHot.style.display =
        "block";

}


/* =========================================================
   COMEÇAR
========================================================= */

playHot.addEventListener(
    "click",
    function(){

        hideAll();

        /*
           O áudio começa exatamente no clique.
           Isso evita o bloqueio de autoplay.
        */

        playAudio(

            AUDIO.inicio,

            function(){

                showScreen(
                    "regras.png"
                );

                rulesHot.style.display =
                    "block";

            }

        );

    }
);


/* =========================================================
   REGRAS
========================================================= */

rulesHot.addEventListener(
    "click",
    function(){

        stopAudio();

        hideAll();

        showScreen(
            "entrar.png"
        );

        nameBox.style.display =
            "block";

        enterHot.style.display =
            "block";

        nameBox.focus();

        playAudio(
            AUDIO.participante
        );

    }
);


/* =========================================================
   ENTRAR
========================================================= */

enterHot.addEventListener(
    "click",
    submitName
);


nameBox.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            submitName();

        }

    }
);


/* =========================================================
   NOME
========================================================= */

function submitName(){

    const name =
        nameBox.value.trim();

    if(!name){

        nameBox.focus();

        return;

    }

    localStorage.setItem(
        "trilhar_player_name",
        name
    );

    hideAll();

    playAudio(

        AUDIO.boaSorte,

        function(){

            showValueScreen(0);

        }

    );

}


/* =========================================================
   TELA DO VALOR
========================================================= */

function showValueScreen(index){

    stopAudio();

    hideAll();

    currentQuestion =
        index;

    showScreen(
        VALUES[index]
    );

    playAudio(

        VALUE_AUDIO[index],

        function(){

            showQuestion(index);

        }

    );

}


/* =========================================================
   PERGUNTA
========================================================= */

function showQuestion(index){

    stopAudio();

    hideAll();

    showScreen(
        QUESTIONS[index]
    );


    answerButtons.forEach(
        function(button){

            button.style.display =
                "block";

            button.style.pointerEvents =
                "auto";

        }
    );


    answering = false;


    /*
       Música de suspense.
    */

    playAudio(
        AUDIO.suspense
    );

}


/* =========================================================
   RESPOSTAS
========================================================= */

answerButtons.forEach(
    function(button,index){

        button.addEventListener(
            "click",
            function(){

                answer(
                    index + 1
                );

            }
        );

    }
);


/* =========================================================
   PROCESSAR RESPOSTA
========================================================= */

function answer(selected){

    if(answering){

        return;

    }

    answering = true;


    answerButtons.forEach(
        function(button){

            button.style.pointerEvents =
                "none";

        }
    );


    stopAudio();


    const correct =
        CORRECT[currentQuestion];


    /* =====================================================
       ACERTO
    ===================================================== */

    if(selected === correct){

        playAudio(

            AUDIO.certa,

            function(){

                /*
                   Pergunta 10:
                   vai para o final.
                */

                if(currentQuestion === 9){

                    showFinal();

                    return;

                }


                /*
                   Próximo valor.
                */

                currentQuestion++;

                showValueScreen(
                    currentQuestion
                );

            }

        );

        return;

    }


    /* =====================================================
       ERRO
    ===================================================== */

    playAudio(

        AUDIO.errada,

        function(){

            hideAll();

            showScreen(
                "perdeu.png"
            );


            playAudio(

                AUDIO.moeda,

                function(){

                    /*
                       VOLTA PARA A MESMA
                       PERGUNTA.
                    */

                    showQuestion(
                        currentQuestion
                    );

                }

            );

        }

    );

}


/* =========================================================
   FINAL
========================================================= */

function showFinal(){

    stopAudio();

    hideAll();

    showScreen(
        "parabens.png"
    );


    playAudio(
        AUDIO.final
    );

}


/* =========================================================
   INICIAR
========================================================= */

showStart();

</script>

</body>
</html>
