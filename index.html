<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guima Show</title>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

#tela {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #000;
    cursor: pointer;
}

#imagem {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

</style>
</head>

<body>

<div id="tela">

    <img
        id="imagem"
        src="inicio.png"
        alt="Início"
    >

</div>


<script>

const tela = document.getElementById("tela");
const imagem = document.getElementById("imagem");

let iniciou = false;

tela.addEventListener("click", function () {

    if (iniciou) {
        return;
    }

    iniciou = true;

    const audio = new Audio(
        "Vai%20comecar%20o%20show%20do%20milhao.mp3"
    );

    audio.play();

    audio.addEventListener("ended", function () {

        imagem.src = "regras.png";

    });

});

</script>

</body>
</html>
