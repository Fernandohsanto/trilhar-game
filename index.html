<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guima Show</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

.tela {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.slide {
    position: relative;
    width: min(100vw, 177.7778vh);
    aspect-ratio: 16 / 9;
}

.slide img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

/* BOTÕES INVISÍVEIS */

.resposta {
    position: absolute;
    border: none;
    background: transparent;
    cursor: pointer;
    z-index: 10;
}

#A {
    left: 7.5%;
    top: 38.8%;
    width: 43.8%;
    height: 6.5%;
}

#B {
    left: 7.5%;
    top: 47%;
    width: 43.8%;
    height: 6.5%;
}

#C {
    left: 7.5%;
    top: 55.2%;
    width: 43.8%;
    height: 6.5%;
}

#D {
    left: 7.5%;
    top: 63.3%;
    width: 43.8%;
    height: 6.5%;
}

/* RESULTADO */

#resultado {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    padding: 25px 45px;
    border-radius: 15px;

    color: white;
    font-family: Arial, sans-serif;
    font-size: 32px;
    font-weight: bold;

    display: none;
    z-index: 100;
    text-align: center;
}

.acertou {
    background: rgba(0, 130, 40, 0.95);
}

.errou {
    background: rgba(170, 0, 0, 0.95);
}

#pontuacao {
    position: fixed;
    right: 20px;
    top: 20px;

    background: rgba(0,0,0,.75);
    color: white;

    padding: 10px 18px;
    border-radius: 10px;

    font-family: Arial, sans-serif;
    font-size: 18px;

    display: none;
    z-index: 100;
}
</style>
</head>

<body>

<div class="tela">

    <div class="slide">

        <img src="tela1.png" alt="Guima Show">

        <!-- RESPOSTA A -->
        <button
            id="A"
            class="resposta"
            onclick="responder(1)">
        </button>

        <!-- RESPOSTA B -->
        <button
            id="B"
            class="resposta"
            onclick="responder(2)">
        </button>

        <!-- RESPOSTA C -->
        <button
            id="C"
            class="resposta"
            onclick="responder(3)">
        </button>

        <!-- RESPOSTA D -->
        <button
            id="D"
            class="resposta"
            onclick="responder(4)">
        </button>

    </div>

</div>

<div id="resultado"></div>

<div id="pontuacao">
    Pontos: <span id="pontos">0</span>
</div>


<!-- =========================
     ÁUDIO DE ACERTO
     ========================= -->

<audio id="audioCerta" preload="auto">
    <source
        src="./certa%20resposta.mp3"
        type="audio/mpeg">
</audio>


<!-- =========================
     ÁUDIO DE ERRO
     ========================= -->

<audio id="audioErrada" preload="auto">
    <source
        src="./Que%20pena%20vc%20errou.mp3"
        type="audio/mpeg">
</audio>


<script>

/* ==========================================
   PERGUNTA 1
   ========================================== */

const perguntas = [

    {
        pergunta:
        "Qual das alternativas a seguir expressa a definição correta de Visão de Dono?",

        correta: 1
    }

];


/* ==========================================
   VARIÁVEIS
   ========================================== */

let perguntaAtual = 0;
let pontos = 0;
let respondeu = false;


/* ==========================================
   ÁUDIOS
   ========================================== */

const audioCerta =
    document.getElementById("audioCerta");

const audioErrada =
    document.getElementById("audioErrada");

audioCerta.volume = 1;
audioErrada.volume = 1;


/* ==========================================
   RESPONDER
   ========================================== */

function responder(numero) {

    if (respondeu) {
        return;
    }

    respondeu = true;

    const pergunta =
        perguntas[perguntaAtual];

    const resultado =
        document.getElementById("resultado");

    const pontuacao =
        document.getElementById("pontuacao");

    const pontosTela =
        document.getElementById("pontos");


    pontuacao.style.display = "block";


    /* ======================================
       ACERTOU
       ====================================== */

    if (numero === pergunta.correta) {

        pontos += 1000;

        resultado.innerHTML =
            "✅ ACERTOU!<br>" +
            "<small>+1.000 pontos</small>";

        resultado.className =
            "acertou";


        /* TOCA ÁUDIO DE ACERTO */

        audioErrada.pause();
        audioErrada.currentTime = 0;

        audioCerta.currentTime = 0;

        audioCerta.play().catch(function(erro) {
            console.log("Erro no áudio de acerto:", erro);
        });

    }


    /* ======================================
       ERROU
       ====================================== */

    else {

        resultado.innerHTML =
            "❌ ERROU!<br>" +
            "<small>A resposta correta é " +
            pergunta.correta +
            "</small>";

        resultado.className =
            "errou";


        /* TOCA ÁUDIO DE ERRO */

        audioCerta.pause();
        audioCerta.currentTime = 0;

        audioErrada.currentTime = 0;

        audioErrada.play().catch(function(erro) {
            console.log("Erro no áudio de erro:", erro);
        });

    }


    /* ATUALIZA PONTUAÇÃO */

    pontosTela.innerText = pontos;

    resultado.style.display = "block";


    /* ======================================
       LIBERA NOVO CLIQUE
       ====================================== */

    setTimeout(function() {

        resultado.style.display = "none";

        respondeu = false;

    }, 2500);

}

</script>

</body>
</html>
