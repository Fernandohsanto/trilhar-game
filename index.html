<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guima Show</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    #game {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: #000;
        overflow: hidden;
    }

    #screen {
        position: absolute;
        width: 100%;
        height: 100%;
        inset: 0;
        object-fit: contain;
        user-select: none;
    }

    /* =====================================================
       BOTÕES INVISÍVEIS
    ===================================================== */

    .hotspot {
        position: absolute;
        border: 0;
        background: transparent;
        cursor: pointer;
        z-index: 10;
    }

    /* Botão da tela inicial */
    #playHot {
        left: 25%;
        top: 70%;
        width: 50%;
        height: 25%;
    }

    /* Tela de regras */
    #rulesHot {
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
    }

    /* Botão entrar */
    #enterHot {
        left: 69%;
        top: 20%;
        width: 25%;
        height: 18%;
    }

    /* =====================================================
       CAMPO DE NOME
    ===================================================== */

    #nameBox {
        display: none;

        position: absolute;
        left: 29%;
        top: 65%;
        width: 42%;
        height: 7%;

        z-index: 20;

        border: 3px solid white;
        border-radius: 10px;

        background: rgba(0,0,0,0.85);

        color: white;

        text-align: center;

        font-size: clamp(18px, 2vw, 32px);
        font-weight: bold;

        outline: none;
    }

    #nameBox::placeholder {
        color: #ddd;
    }

    /* =====================================================
       ALTERNATIVAS
    ===================================================== */

    .answer {
        display: none;

        position: absolute;

        z-index: 20;

        border: 0;
        background: transparent;

        cursor: pointer;
    }

    /* A */
    #answerA {
        left: 7.5%;
        top: 38.8%;
        width: 43.8%;
        height: 6.5%;
    }

    /* B */
    #answerB {
        left: 7.5%;
        top: 47%;
        width: 43.8%;
        height: 6.5%;
    }

    /* C */
    #answerC {
        left: 7.5%;
        top: 55.2%;
        width: 43.8%;
        height: 6.5%;
    }

    /* D */
    #answerD {
        left: 7.5%;
        top: 63.3%;
        width: 43.8%;
        height: 6.5%;
    }

    /* =====================================================
       MENSAGEM DE ERRO DE ÁUDIO
       Fica escondida normalmente.
    ===================================================== */

    #audioError {
        display: none;

        position: absolute;

        left: 50%;
        bottom: 20px;

        transform: translateX(-50%);

        z-index: 100;

        padding: 10px 18px;

        background: rgba(180,0,0,0.90);

        color: white;

        border-radius: 8px;

        font-family: Arial, sans-serif;

        font-size: 14px;

        text-align: center;
    }

</style>
</head>

<body>

<div id="game">

    <!-- ==================================================
         IMAGEM PRINCIPAL
    =================================================== -->

    <img
        id="screen"
        src="inicio.png"
        alt="Guima Show"
    >


    <!-- ==================================================
         BOTÕES
    =================================================== -->

    <button
        id="playHot"
        class="hotspot"
        aria-label="Começar"
    ></button>

    <button
        id="rulesHot"
        class="hotspot"
        aria-label="Continuar"
    ></button>

    <button
        id="enterHot"
        class="hotspot"
        aria-label="Entrar"
    ></button>


    <!-- ==================================================
         NOME DO PARTICIPANTE
    =================================================== -->

    <input
        id="nameBox"
        type="text"
        maxlength="30"
        placeholder="Digite seu nome"
        autocomplete="off"
    >


    <!-- ==================================================
         RESPOSTAS
    =================================================== -->

    <button
        id="answerA"
        class="answer"
        aria-label="Resposta A"
    ></button>

    <button
        id="answerB"
        class="answer"
        aria-label="Resposta B"
    ></button>

    <button
        id="answerC"
        class="answer"
        aria-label="Resposta C"
    ></button>

    <button
        id="answerD"
        class="answer"
        aria-label="Resposta D"
    ></button>


    <!-- ERRO DE ÁUDIO -->

    <div id="audioError"></div>

</div>


<script>

/* =========================================================
   ELEMENTOS
========================================================= */

const screen = document.getElementById("screen");

const playHot = document.getElementById("playHot");
const rulesHot = document.getElementById("rulesHot");
const enterHot = document.getElementById("enterHot");

const nameBox = document.getElementById("nameBox");

const answerA = document.getElementById("answerA");
const answerB = document.getElementById("answerB");
const answerC = document.getElementById("answerC");
const answerD = document.getElementById("answerD");

const answerButtons = [
    answerA,
    answerB,
    answerC,
    answerD
];

const audioError = document.getElementById("audioError");


/* =========================================================
   ÁUDIOS
========================================================= */

const AUDIO = {

    inicio:
        "Vai comecar o show do milhao.mp3",

    participante:
        "Vamos conhecer nosso participante.mp3",

    boaSorte:
        "Boa Sorte.mp3",

    valor1:
        "1 Mil.mp3",

    valor5:
        "5 mil.mp3",

    valor10:
        "10 mil.mp3",

    valor30:
        "30 mil.mp3",

    valor50:
        "50 mil.mp3",

    valor100:
        "1000 mil.mp3",

    valor200:
        "2000 mil.mp3",

    valor400:
        "4000 mil.mp3",

    valor500:
        "5000 mil.mp3",

    valor1M:
        "1000 mil.mp3",

    suspense:
        "Música suspense de perguntas.mp3",

    certa:
        "certa resposta.mp3",

    errada:
        "Que pena vc errou.mp3",

    moeda:
        "Moeda caindo quando perde.mp3",

    final:
        "Parabens vc ganhou 1mila de reais.mp3"
};


/* =========================================================
   IMAGENS
========================================================= */

const VALUES = [

    "valor-1k.png",

    "valor-5k.png",

    "valor-10k.png",

    "valor-30k.png",

    "valor-50k.png",

    "valor-100k.png",

    "valor-200k.png",

    "valor-400k.png",

    "valor-500k.png",

    "valor-1m.png"
];


const QUESTIONS = [

    "pergunta-1.png",

    "pergunta-2.png",

    "pergunta-3.png",

    "pergunta-4.png",

    "pergunta-5.png",

    "pergunta-6.png",

    "pergunta-7.png",

    "pergunta-8.png",

    "pergunta-9.png",

    "pergunta-10.png"
];


/* =========================================================
   ÁUDIO DE CADA VALOR
========================================================= */

const VALUE_AUDIO = [

    AUDIO.valor1,

    AUDIO.valor5,

    AUDIO.valor10,

    AUDIO.valor30,

    AUDIO.valor50,

    AUDIO.valor100,

    AUDIO.valor200,

    AUDIO.valor400,

    AUDIO.valor500,

    AUDIO.valor1M

];


/* =========================================================
   RESPOSTAS CORRETAS
=========================================================

   1 = A
   2 = B
   3 = C
   4 = D

========================================================= */

const CORRECT = [

    1,
    4,
    2,
    2,
    3,
    4,
    2,
    3,
    4,
    4

];


/* =========================================================
   CONTROLE
========================================================= */

let currentQuestion = 0;

let currentAudio = null;

let playerName = "";

let answering = false;


/* =========================================================
   ESCONDER TUDO
========================================================= */

function hideAllButtons() {

    playHot.style.display = "none";

    rulesHot.style.display = "none";

    enterHot.style.display = "none";

    nameBox.style.display = "none";

    answerButtons.forEach(function(button) {

        button.style.display = "none";

        button.style.pointerEvents = "none";

    });

}


/* =========================================================
   PARAR ÁUDIO
========================================================= */

function stopAudio() {

    if (currentAudio) {

        currentAudio.pause();

        currentAudio.currentTime = 0;

        currentAudio = null;

    }

}


/* =========================================================
   ESCONDER ERRO
========================================================= */

function hideAudioError() {

    audioError.style.display = "none";

    audioError.textContent = "";

}


/* =========================================================
   MOSTRAR ERRO
========================================================= */

function showAudioError(file) {

    audioError.textContent =
        "Não foi possível carregar o áudio: " + file;

    audioError.style.display = "block";

}


/* =========================================================
   TOCAR ÁUDIO
========================================================= */

function playAudio(file, callback) {

    stopAudio();

    hideAudioError();

    console.log("Tentando tocar:", file);

    const audio = new Audio();

    currentAudio = audio;

    audio.preload = "auto";

    /*
       encodeURI permite espaços e acentos
       no nome do arquivo.
    */

    audio.src = encodeURI(file);

    audio.onended = function() {

        if (currentAudio === audio) {

            currentAudio = null;

        }

        if (callback) {

            callback();

        }

    };


    audio.onerror = function() {

        console.error(
            "Erro ao carregar áudio:",
            file
        );

        if (currentAudio === audio) {

            currentAudio = null;

        }

        showAudioError(file);

        /*
           Mesmo se o áudio der erro,
           o jogo continua.
        */

        if (callback) {

            callback();

        }

    };


    const promise = audio.play();


    if (promise !== undefined) {

        promise.catch(function(error) {

            console.error(
                "Erro ao reproduzir áudio:",
                file,
                error
            );

            /*
               Se o navegador bloquear,
               mostra o erro.
            */

            showAudioError(file);

        });

    }

}


/* =========================================================
   MOSTRAR IMAGEM
========================================================= */

function showScreen(file) {

    screen.src = file;

}


/* =========================================================
   TELA INICIAL
========================================================= */

function showStart() {

    stopAudio();

    hideAllButtons();

    hideAudioError();

    showScreen("inicio.png");

    playHot.style.display = "block";

}


/* =========================================================
   CLIQUE NA TELA INICIAL
=========================================================

   IMPORTANTE:

   O áudio começa somente depois do clique.
   Isso evita o bloqueio de autoplay do navegador.

========================================================= */

playHot.addEventListener("click", function() {

    hideAllButtons();

    answering = false;

    /*
       O áudio é iniciado diretamente
       pela ação do usuário.
    */

    playAudio(

        AUDIO.inicio,

        function() {

            /*
               Quando terminar o áudio,
               mostra as regras.
            */

            showScreen("regras.png");

            rulesHot.style.display = "block";

        }

    );

});


/* =========================================================
   REGRAS
========================================================= */

rulesHot.addEventListener("click", function() {

    stopAudio();

    hideAllButtons();

    hideAudioError();

    showScreen("entrar.png");

    nameBox.style.display = "block";

    enterHot.style.display = "block";

    nameBox.focus();

    /*
       Áudio do participante.
    */

    playAudio(
        AUDIO.participante
    );

});


/* =========================================================
   ENTRAR
========================================================= */

enterHot.addEventListener("click", function() {

    submitName();

});


/* =========================================================
   ENTER NO CAMPO DE NOME
========================================================= */

nameBox.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        submitName();

    }

});


/* =========================================================
   ENVIAR NOME
========================================================= */

function submitName() {

    playerName =
        nameBox.value.trim();


    if (!playerName) {

        nameBox.focus();

        return;

    }


    localStorage.setItem(
        "trilhar_player_name",
        playerName
    );


    hideAllButtons();

    hideAudioError();


    /*
       Boa Sorte.
       Quando terminar,
       começa o primeiro valor.
    */

    playAudio(

        AUDIO.boaSorte,

        function() {

            showValueScreen(0);

        }

    );

}


/* =========================================================
   TELA DO VALOR
========================================================= */

function showValueScreen(index) {

    stopAudio();

    hideAllButtons();

    hideAudioError();

    answering = false;

    currentQuestion = index;


    /*
       Mostra a tela do valor.
    */

    showScreen(
        VALUES[index]
    );


    /*
       Toca o áudio correspondente.
       Depois vai para a pergunta.
    */

    playAudio(

        VALUE_AUDIO[index],

        function() {

            showQuestion(index);

        }

    );

}


/* =========================================================
   TELA DA PERGUNTA
========================================================= */

function showQuestion(index) {

    stopAudio();

    hideAllButtons();

    hideAudioError();

    answering = false;


    /*
       Mostra a pergunta.
    */

    showScreen(
        QUESTIONS[index]
    );


    /*
       Libera os quatro botões.
    */

    answerButtons.forEach(function(button) {

        button.style.display = "block";

        button.style.pointerEvents = "auto";

    });


    /*
       Começa o suspense.
    */

    playAudio(
        AUDIO.suspense
    );

}


/* =========================================================
   CLIQUE NAS RESPOSTAS
========================================================= */

answerA.addEventListener("click", function() {

    answer(1);

});


answerB.addEventListener("click", function() {

    answer(2);

});


answerC.addEventListener("click", function() {

    answer(3);

});


answerD.addEventListener("click", function() {

    answer(4);

});


/* =========================================================
   RESPONDER
========================================================= */

function answer(selected) {

    /*
       Evita clicar duas vezes.
    */

    if (answering) {

        return;

    }

    answering = true;


    /*
       Desabilita as alternativas.
    */

    answerButtons.forEach(function(button) {

        button.style.pointerEvents = "none";

    });


    /*
       Para o suspense.
    */

    stopAudio();


    const correct =
        CORRECT[currentQuestion];


    /* =====================================================
       ACERTO
    ===================================================== */

    if (selected === correct) {

        playAudio(

            AUDIO.certa,

            function() {

                /*
                   Se for a pergunta 10,
                   vai direto para Parabéns.
                */

                if (currentQuestion === 9) {

                    showFinal();

                    return;

                }


                /*
                   Próxima pergunta.
                */

                currentQuestion++;

                showValueScreen(
                    currentQuestion
                );

            }

        );

        return;

    }


    /* =====================================================
       ERRO
    ===================================================== */

    playAudio(

        AUDIO.errada,

        function() {

            /*
               Mostra tela "Você Perdeu".
            */

            hideAllButtons();

            showScreen(
                "perdeu.png"
            );


            /*
               Moeda caindo.
            */

            playAudio(

                AUDIO.moeda,

                function() {

                    /*
                       VOLTA PARA A MESMA PERGUNTA.
                    */

                    showQuestion(
                        currentQuestion
                    );

                }

            );

        }

    );

}


/* =========================================================
   FINAL
========================================================= */

function showFinal() {

    stopAudio();

    hideAllButtons();

    hideAudioError();

    showScreen(
        "parabenos.png"
    );


    /*
       Áudio final:
       Parabéns, você ganhou 1 milhão...
    */

    playAudio(
        AUDIO.final
    );

}


/* =========================================================
   INICIAR
========================================================= */

showStart();

</script>

</body>
</html>
