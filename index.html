<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guima Show</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
}

#screen {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    user-select: none;
}

/* =====================================================
   BOTÕES INVISÍVEIS
===================================================== */

.hotspot {
    position: absolute;

    border: none;
    outline: none;

    background: transparent;

    cursor: pointer;

    z-index: 20;
}

/* INÍCIO */

#playHot {
    left: 25%;
    top: 70%;

    width: 50%;
    height: 25%;
}


/* REGRAS */

#rulesHot {
    left: 0;
    top: 0;

    width: 100%;
    height: 100%;
}


/* ENTRAR */

#enterHot {
    left: 69%;
    top: 20%;

    width: 25%;
    height: 18%;
}


/* =====================================================
   CAMPO DE NOME
===================================================== */

#nameBox {

    display: none;

    position: absolute;

    left: 29%;
    top: 65%;

    width: 42%;
    height: 7%;

    z-index: 30;

    border: 3px solid white;
    border-radius: 10px;

    background: rgba(0,0,0,.85);

    color: white;

    text-align: center;

    font-size: clamp(18px, 2vw, 32px);

    font-weight: bold;

    outline: none;
}

#nameBox::placeholder {
    color: #ddd;
}


/* =====================================================
   RESPOSTAS
===================================================== */

.answer {

    display: none;

    position: absolute;

    z-index: 30;

    border: none;

    background: transparent;

    cursor: pointer;
}


/* A */

#answerA {

    left: 7.5%;
    top: 38.8%;

    width: 43.8%;
    height: 6.5%;
}


/* B */

#answerB {

    left: 7.5%;
    top: 47%;

    width: 43.8%;
    height: 6.5%;
}


/* C */

#answerC {

    left: 7.5%;
    top: 55.2%;

    width: 43.8%;
    height: 6.5%;
}


/* D */

#answerD {

    left: 7.5%;
    top: 63.3%;

    width: 43.8%;
    height: 6.5%;
}


/* =====================================================
   MENSAGEM DE ERRO
===================================================== */

#audioError {

    display: none;

    position: absolute;

    left: 50%;
    bottom: 20px;

    transform: translateX(-50%);

    z-index: 100;

    max-width: 90%;

    padding: 12px 20px;

    border-radius: 8px;

    background: rgba(180,0,0,.95);

    color: white;

    font-family: Arial, sans-serif;

    font-size: 14px;

    text-align: center;
}

</style>
</head>


<body>

<div id="game">


    <!-- =================================================
         TELA
    ================================================== -->

    <img
        id="screen"
        src="inicio.png"
        alt="Guima Show"
    >


    <!-- =================================================
         BOTÕES
    ================================================== -->

    <button
        id="playHot"
        class="hotspot"
        aria-label="Começar"
    ></button>


    <button
        id="rulesHot"
        class="hotspot"
        aria-label="Continuar"
    ></button>


    <button
        id="enterHot"
        class="hotspot"
        aria-label="Entrar"
    ></button>


    <!-- =================================================
         NOME
    ================================================== -->

    <input
        id="nameBox"
        type="text"
        maxlength="30"
        placeholder="Digite seu nome"
        autocomplete="off"
    >


    <!-- =================================================
         RESPOSTAS
    ================================================== -->

    <button
        id="answerA"
        class="answer"
        aria-label="Resposta A"
    ></button>


    <button
        id="answerB"
        class="answer"
        aria-label="Resposta B"
    ></button>


    <button
        id="answerC"
        class="answer"
        aria-label="Resposta C"
    ></button>


    <button
        id="answerD"
        class="answer"
        aria-label="Resposta D"
    ></button>


    <!-- =================================================
         ERRO DE ÁUDIO
    ================================================== -->

    <div id="audioError"></div>

</div>


<script>

/* =========================================================
   ELEMENTOS
========================================================= */

const screen =
    document.getElementById("screen");

const playHot =
    document.getElementById("playHot");

const rulesHot =
    document.getElementById("rulesHot");

const enterHot =
    document.getElementById("enterHot");

const nameBox =
    document.getElementById("nameBox");

const answerButtons = [

    document.getElementById("answerA"),

    document.getElementById("answerB"),

    document.getElementById("answerC"),

    document.getElementById("answerD")

];

const audioError =
    document.getElementById("audioError");


/* =========================================================
   ÁUDIOS
========================================================= */

const AUDIO = {

    inicio:
        "Vai começar o show do milhao.mp3",

    participante:
        "Vamos conhecer nosso participante.mp3",

    boaSorte:
        "Boa Sorte.mp3",

    valor1:
        "1 Mil.mp3",

    valor5:
        "5 mil.mp3",

    valor10:
        "10 mil.mp3",

    valor30:
        "30 mil.mp3",

    valor50:
        "50 mil.mp3",

    valor100:
        "1000 mil.mp3",

    valor200:
        "2000 mil.mp3",

    valor400:
        "4000 mil.mp3",

    valor500:
        "5000 mil.mp3",

    valor1M:
        "1000 mil.mp3",

    suspense:
        "Música suspense de perguntas.mp3",

    certa:
        "certa resposta.mp3",

    errada:
        "Que pena vc errou.mp3",

    moeda:
        "Moeda caindo quando perde.mp3",

    final:
        "Parabens vc ganhou 1mila de reais.mp3"

};


/* =========================================================
   IMAGENS DOS VALORES
========================================================= */

const VALUES = [

    "valor-1k.png",

    "valor-5k.png",

    "valor-10k.png",

    "valor-30k.png",

    "valor-50k.png",

    "valor-100k.png",

    "valor-200k.png",

    "valor-400k.png",

    "valor-500k.png",

    "valor-1m.png"

];


/* =========================================================
   PERGUNTAS
========================================================= */

const QUESTIONS = [

    "pergunta-1.png",

    "pergunta-2.png",

    "pergunta-3.png",

    "pergunta-4.png",

    "pergunta-5.png",

    "pergunta-6.png",

    "pergunta-7.png",

    "pergunta-8.png",

    "pergunta-9.png",

    "pergunta-10.png"

];


/* =========================================================
   RESPOSTAS CORRETAS
=========================================================

A = 1
B = 2
C = 3
D = 4

========================================================= */

const CORRECT = [

    1,
    4,
    2,
    2,
    3,
    4,
    2,
    3,
    4,
    4

];


/* =========================================================
   ÁUDIO DOS VALORES
========================================================= */

const VALUE_AUDIO = [

    AUDIO.valor1,

    AUDIO.valor5,

    AUDIO.valor10,

    AUDIO.valor30,

    AUDIO.valor50,

    AUDIO.valor100,

    AUDIO.valor200,

    AUDIO.valor400,

    AUDIO.valor500,

    AUDIO.valor1M

];


/* =========================================================
   CONTROLE
========================================================= */

let currentQuestion = 0;

let currentAudio = null;

let answering = false;


/* =========================================================
   FUNÇÃO PARA CRIAR O CAMINHO DO ARQUIVO
=========================================================

IMPORTANTE:

Não escrevemos manualmente:

%20
%C3%A7
%C3%BA

O navegador faz isso automaticamente.

========================================================= */

function fileURL(filename) {

    return "./" + encodeURI(filename);

}


/* =========================================================
   ESCONDER TUDO
========================================================= */

function hideAll() {

    playHot.style.display = "none";

    rulesHot.style.display = "none";

    enterHot.style.display = "none";

    nameBox.style.display = "none";


    answerButtons.forEach(function(button) {

        button.style.display = "none";

        button.style.pointerEvents = "none";

    });

}


/* =========================================================
   PARAR ÁUDIO
========================================================= */

function stopAudio() {

    if (currentAudio) {

        currentAudio.pause();

        currentAudio.currentTime = 0;

        currentAudio = null;

    }

}


/* =========================================================
   ERRO
========================================================= */

function hideAudioError() {

    audioError.style.display = "none";

    audioError.textContent = "";

}


function showAudioError(file) {

    audioError.textContent =
        "Não consegui carregar: " + file;

    audioError.style.display = "block";

}


/* =========================================================
   TOCAR ÁUDIO
========================================================= */

function playAudio(file, callback) {

    stopAudio();

    hideAudioError();


    const audio =
        new Audio();


    currentAudio =
        audio;


    audio.preload =
        "auto";


    /*
       Aqui está a correção importante.

       O nome normal do arquivo é passado para
       encodeURI(), que transforma corretamente:

       espaço
       ç
       ã
       ú
       etc.

       em uma URL válida.
    */

    audio.src =
        fileURL(file);


    console.log(
        "Carregando áudio:",
        audio.src
    );


    audio.addEventListener(
        "ended",
        function() {

            if (currentAudio === audio) {

                currentAudio = null;

            }

            if (callback) {

                callback();

            }

        }
    );


    audio.addEventListener(
        "error",
        function() {

            console.error(
                "ERRO NO ÁUDIO:",
                audio.src
            );


            if (currentAudio === audio) {

                currentAudio = null;

            }


            showAudioError(file);

        }
    );


    audio.play()
        .then(function() {

            console.log(
                "Áudio reproduzindo:",
                file
            );

        })
        .catch(function(error) {

            console.error(
                "Navegador bloqueou o áudio:",
                error
            );


            showAudioError(file);

        });

}


/* =========================================================
   TROCAR IMAGEM
========================================================= */

function showScreen(file) {

    screen.src =
        file;

}


/* =========================================================
   TELA INICIAL
========================================================= */

function showStart() {

    stopAudio();

    hideAll();

    hideAudioError();


    showScreen(
        "inicio.png"
    );


    playHot.style.display =
        "block";

}


/* =========================================================
   INÍCIO DO JOGO
=========================================================

O áudio começa somente depois do clique.

========================================================= */

playHot.addEventListener(
    "click",
    function() {


        hideAll();


        /*
           IMPORTANTE:

           O play acontece diretamente dentro
           do clique do usuário.

           Isso evita bloqueio de autoplay.
        */

        playAudio(

            AUDIO.inicio,

            function() {


                /*
                   Quando o áudio acabar,
                   entra nas regras.
                */

                showScreen(
                    "regras.png"
                );


                rulesHot.style.display =
                    "block";

            }

        );

    }
);


/* =========================================================
   REGRAS
========================================================= */

rulesHot.addEventListener(
    "click",
    function() {


        stopAudio();

        hideAll();

        hideAudioError();


        showScreen(
            "entrar.png"
        );


        nameBox.style.display =
            "block";


        enterHot.style.display =
            "block";


        nameBox.focus();


        /*
           Áudio:

           Vamos conhecer nosso participante
        */

        playAudio(
            AUDIO.participante
        );

    }
);


/* =========================================================
   ENTRAR
========================================================= */

enterHot.addEventListener(
    "click",
    function() {

        submitName();

    }
);


/* =========================================================
   ENTER NO NOME
========================================================= */

nameBox.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            submitName();

        }

    }
);


/* =========================================================
   ENVIAR NOME
========================================================= */

function submitName() {


    const playerName =
        nameBox.value.trim();


    if (!playerName) {

        nameBox.focus();

        return;

    }


    localStorage.setItem(
        "trilhar_player_name",
        playerName
    );


    hideAll();


    /*
       Boa Sorte.

       Depois do áudio:
       primeira tela de valor.
    */

    playAudio(

        AUDIO.boaSorte,

        function() {

            showValueScreen(0);

        }

    );

}


/* =========================================================
   TELA DO VALOR
========================================================= */

function showValueScreen(index) {


    stopAudio();

    hideAll();

    hideAudioError();


    currentQuestion =
        index;


    showScreen(
        VALUES[index]
    );


    /*
       Toca o áudio do valor.

       Quando acabar:
       pergunta.
    */

    playAudio(

        VALUE_AUDIO[index],

        function() {

            showQuestion(index);

        }

    );

}


/* =========================================================
   PERGUNTA
========================================================= */

function showQuestion(index) {


    stopAudio();

    hideAll();

    hideAudioError();


    answering =
        false;


    showScreen(
        QUESTIONS[index]
    );


    answerButtons.forEach(
        function(button) {

            button.style.display =
                "block";

            button.style.pointerEvents =
                "auto";

        }
    );


    /*
       Suspense.
    */

    playAudio(
        AUDIO.suspense
    );

}


/* =========================================================
   BOTÕES DE RESPOSTA
========================================================= */

answerButtons.forEach(
    function(button, index) {


        button.addEventListener(
            "click",
            function() {


                answer(
                    index + 1
                );

            }
        );

    }
);


/* =========================================================
   RESPONDER
========================================================= */

function answer(selected) {


    if (answering) {

        return;

    }


    answering =
        true;


    answerButtons.forEach(
        function(button) {

            button.style.pointerEvents =
                "none";

        }
    );


    stopAudio();


    const correct =
        CORRECT[currentQuestion];


    /* =====================================================
       ACERTO
    ===================================================== */

    if (selected === correct) {


        playAudio(

            AUDIO.certa,

            function() {


                /*
                   Pergunta 10:
                   final.
                */

                if (
                    currentQuestion === 9
                ) {


                    showFinal();

                    return;

                }


                /*
                   Próxima.
                */

                currentQuestion++;


                showValueScreen(
                    currentQuestion
                );

            }

        );


        return;

    }


    /* =====================================================
       ERRO
    ===================================================== */

    playAudio(

        AUDIO.errada,

        function() {


            hideAll();


            showScreen(
                "perdeu.png"
            );


            /*
               Som da moeda.
            */

            playAudio(

                AUDIO.moeda,

                function() {


                    /*
                       Volta para a MESMA
                       pergunta.
                    */

                    showQuestion(
                        currentQuestion
                    );

                }

            );

        }

    );

}


/* =========================================================
   FINAL
========================================================= */

function showFinal() {


    stopAudio();

    hideAll();

    hideAudioError();


    showScreen(
        "parabenos.png"
    );


    /*
       Parabéns!
    */

    playAudio(
        AUDIO.final
    );

}


/* =========================================================
   INICIAR
========================================================= */

showStart();

</script>

</body>
</html>
