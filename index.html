<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Guima Show</title>


<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

}

#game {

    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: #000;

}

#screen {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    user-select: none;

}


/* =========================================================
   BOTÕES INVISÍVEIS
========================================================= */

.hotspot {

    position: absolute;

    border: none;

    background: transparent;

    cursor: pointer;

    z-index: 20;

}


/* INÍCIO */

#playHot {

    left: 25%;
    top: 70%;

    width: 50%;
    height: 25%;

}


/* REGRAS */

#rulesHot {

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

}


/* ENTRAR */

#enterHot {

    left: 69%;
    top: 20%;

    width: 25%;
    height: 18%;

}


/* =========================================================
   NOME
========================================================= */

#nameBox {

    display: none;

    position: absolute;

    left: 29%;
    top: 65%;

    width: 42%;
    height: 7%;

    z-index: 30;

    border: 3px solid #fff;

    border-radius: 10px;

    background: rgba(0,0,0,.85);

    color: #fff;

    text-align: center;

    font-size: clamp(18px,2vw,32px);

    font-weight: bold;

    outline: none;

}

#nameBox::placeholder {

    color: #ddd;

}


/* =========================================================
   RESPOSTAS
========================================================= */

.answer {

    display: none;

    position: absolute;

    z-index: 30;

    border: none;

    background: transparent;

    cursor: pointer;

}


/* A */

#answerA {

    left: 7.5%;
    top: 38.8%;

    width: 43.8%;
    height: 6.5%;

}


/* B */

#answerB {

    left: 7.5%;
    top: 47%;

    width: 43.8%;
    height: 6.5%;

}


/* C */

#answerC {

    left: 7.5%;
    top: 55.2%;

    width: 43.8%;
    height: 6.5%;

}


/* D */

#answerD {

    left: 7.5%;
    top: 63.3%;

    width: 43.8%;
    height: 6.5%;

}


/* =========================================================
   STATUS
========================================================= */

#status {

    display: none;

    position: absolute;

    left: 50%;
    bottom: 15px;

    transform: translateX(-50%);

    z-index: 100;

    max-width: 90%;

    padding: 10px 18px;

    border-radius: 8px;

    background: rgba(180,0,0,.95);

    color: #fff;

    font-family: Arial,sans-serif;

    font-size: 14px;

    text-align: center;

}

</style>

</head>


<body>


<div id="game">


    <img
        id="screen"
        src="inicio.png"
        alt="Guima Show"
    >


    <button
        id="playHot"
        class="hotspot"
        aria-label="Começar"
    ></button>


    <button
        id="rulesHot"
        class="hotspot"
        aria-label="Continuar"
    ></button>


    <button
        id="enterHot"
        class="hotspot"
        aria-label="Entrar"
    ></button>


    <input
        id="nameBox"
        type="text"
        maxlength="30"
        placeholder="Digite seu nome"
        autocomplete="off"
    >


    <button
        id="answerA"
        class="answer"
        aria-label="Resposta A"
    ></button>


    <button
        id="answerB"
        class="answer"
        aria-label="Resposta B"
    ></button>


    <button
        id="answerC"
        class="answer"
        aria-label="Resposta C"
    ></button>


    <button
        id="answerD"
        class="answer"
        aria-label="Resposta D"
    ></button>


    <div id="status"></div>


</div>


<script>


/* =========================================================
   ELEMENTOS
========================================================= */

const screen =
    document.getElementById("screen");

const playHot =
    document.getElementById("playHot");

const rulesHot =
    document.getElementById("rulesHot");

const enterHot =
    document.getElementById("enterHot");

const nameBox =
    document.getElementById("nameBox");

const statusBox =
    document.getElementById("status");


const answerButtons = [

    document.getElementById("answerA"),

    document.getElementById("answerB"),

    document.getElementById("answerC"),

    document.getElementById("answerD")

];


/* =========================================================
   CONFIGURAÇÃO DO GITHUB
========================================================= */

const GITHUB_API =
    "https://api.github.com/repos/Fernandohsanto/trilhar-game/contents/";


/* =========================================================
   ÁUDIOS ENCONTRADOS NO GITHUB
========================================================= */

let AUDIO = {};

let audioReady = false;

let currentAudio = null;


/* =========================================================
   NORMALIZA NOME
========================================================= */

function normalizeName(text) {

    return text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "");

}


/* =========================================================
   BUSCAR TODOS OS ARQUIVOS DO GITHUB
========================================================= */

async function loadAudioFiles() {

    try {

        const response =
            await fetch(GITHUB_API, {
                cache: "no-store"
            });


        if (!response.ok) {

            throw new Error(
                "GitHub API: " +
                response.status
            );

        }


        const files =
            await response.json();


        const mp3Files =
            files.filter(function(file) {

                return (
                    file.type === "file" &&
                    file.name
                        .toLowerCase()
                        .endsWith(".mp3")
                );

            });


        console.log(
            "MP3 encontrados:",
            mp3Files
        );


        /*
           Função que procura um áudio
           pelas palavras do nome.
        */

        function findAudio(words) {

            const wanted =
                words.map(function(word) {

                    return normalizeName(word);

                });


            const found =
                mp3Files.find(function(file) {

                    const name =
                        normalizeName(file.name);


                    return wanted.every(
                        function(word) {

                            return name.includes(word);

                        }
                    );

                });


            if (!found) {

                console.error(
                    "Áudio não encontrado:",
                    words
                );

                return null;

            }


            console.log(
                "Áudio localizado:",
                found.name,
                found.download_url
            );


            return found.download_url;

        }


        /* =================================================
           LOCALIZA CADA ÁUDIO
        ================================================= */


        AUDIO.inicio =
            findAudio([
                "vai",
                "comecar",
                "show",
                "milhao"
            ]);


        AUDIO.participante =
            findAudio([
                "vamos",
                "participante"
            ]);


        AUDIO.boaSorte =
            findAudio([
                "boa",
                "sorte"
            ]);


        AUDIO.valor1 =
            findAudio([
                "1",
                "mil"
            ]);


        AUDIO.valor5 =
            findAudio([
                "5",
                "mil"
            ]);


        AUDIO.valor10 =
            findAudio([
                "10",
                "mil"
            ]);


        AUDIO.valor30 =
            findAudio([
                "30",
                "mil"
            ]);


        AUDIO.valor50 =
            findAudio([
                "50",
                "mil"
            ]);


        AUDIO.valor100 =
            findAudio([
                "1000",
                "mil"
            ]);


        AUDIO.valor200 =
            findAudio([
                "2000",
                "mil"
            ]);


        AUDIO.valor400 =
            findAudio([
                "4000",
                "mil"
            ]);


        AUDIO.valor500 =
            findAudio([
                "5000",
                "mil"
            ]);


        /*
           Para 1 milhão procuramos
           especificamente "milhao".

           Assim não confundimos com
           "1000 mil".
        */

        AUDIO.valor1M =
            findAudio([
                "milhao"
            ]);


        AUDIO.suspense =
            findAudio([
                "suspense",
                "perguntas"
            ]);


        AUDIO.certa =
            findAudio([
                "certa",
                "resposta"
            ]);


        AUDIO.errada =
            findAudio([
                "que",
                "pena",
                "errou"
            ]);


        AUDIO.moeda =
            findAudio([
                "moeda",
                "caindo"
            ]);


        AUDIO.final =
            findAudio([
                "parabens",
                "ganhou"
            ]);


        audioReady = true;


        console.log(
            "MAPA DE ÁUDIOS:",
            AUDIO
        );


    } catch(error) {

        console.error(
            "Erro ao consultar GitHub:",
            error
        );


        showStatus(
            "Não consegui acessar os áudios do GitHub."
        );

    }

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(message) {

    statusBox.innerText =
        message;

    statusBox.style.display =
        "block";

}


function hideStatus() {

    statusBox.style.display =
        "none";

}


/* =========================================================
   ESCONDER ELEMENTOS
========================================================= */

function hideAll() {

    playHot.style.display =
        "none";

    rulesHot.style.display =
        "none";

    enterHot.style.display =
        "none";

    nameBox.style.display =
        "none";


    answerButtons.forEach(
        function(button) {

            button.style.display =
                "none";

            button.style.pointerEvents =
                "none";

        }
    );

}


/* =========================================================
   PARAR ÁUDIO
========================================================= */

function stopAudio() {

    if (currentAudio) {

        currentAudio.pause();

        currentAudio.currentTime =
            0;

        currentAudio =
            null;

    }

}


/* =========================================================
   TOCAR ÁUDIO
========================================================= */

function playAudio(
    url,
    callback
) {


    stopAudio();


    if (!url) {

        console.error(
            "URL de áudio inexistente."
        );


        showStatus(
            "Este áudio não foi encontrado no GitHub."
        );


        if (callback) {

            callback();

        }

        return;

    }


    console.log(
        "TOCANDO:",
        url
    );


    const audio =
        new Audio(url);


    currentAudio =
        audio;


    audio.preload =
        "auto";


    audio.addEventListener(
        "ended",
        function() {

            currentAudio =
                null;


            if (callback) {

                callback();

            }

        }
    );


    audio.addEventListener(
        "error",
        function(event) {

            console.error(
                "Erro no áudio:",
                url,
                event
            );


            currentAudio =
                null;


            showStatus(
                "Erro ao reproduzir o áudio."
            );

        }
    );


    audio.play()
        .then(function() {

            console.log(
                "ÁUDIO TOCANDO!"
            );

        })
        .catch(function(error) {

            console.error(
                "Falha no play:",
                error
            );


            showStatus(
                "O navegador bloqueou o áudio."
            );

        });

}


/* =========================================================
   TROCAR TELA
========================================================= */

function showScreen(file) {

    screen.src =
        file;

}


/* =========================================================
   TELAS
========================================================= */

function showStart() {

    stopAudio();

    hideAll();

    hideStatus();

    showScreen(
        "inicio.png"
    );

    playHot.style.display =
        "block";

}


/* =========================================================
   VALORES
========================================================= */

const VALUES = [

    "valor-1k.png",

    "valor-5k.png",

    "valor-10k.png",

    "valor-30k.png",

    "valor-50k.png",

    "valor-100k.png",

    "valor-200k.png",

    "valor-400k.png",

    "valor-500k.png",

    "valor-1m.png"

];


/* =========================================================
   PERGUNTAS
========================================================= */

const QUESTIONS = [

    "pergunta-1.png",

    "pergunta-2.png",

    "pergunta-3.png",

    "pergunta-4.png",

    "pergunta-5.png",

    "pergunta-6.png",

    "pergunta-7.png",

    "pergunta-8.png",

    "pergunta-9.png",

    "pergunta-10.png"

];


/* =========================================================
   ÁUDIO DOS VALORES
========================================================= */

function getValueAudio(index) {

    const list = [

        AUDIO.valor1,

        AUDIO.valor5,

        AUDIO.valor10,

        AUDIO.valor30,

        AUDIO.valor50,

        AUDIO.valor100,

        AUDIO.valor200,

        AUDIO.valor400,

        AUDIO.valor500,

        AUDIO.valor1M

    ];

    return list[index];

}


/* =========================================================
   RESPOSTAS
========================================================= */

const CORRECT = [

    1,
    4,
    2,
    2,
    3,
    4,
    2,
    3,
    4,
    4

];


let currentQuestion =
    0;

let answering =
    false;


/* =========================================================
   INÍCIO
========================================================= */

playHot.addEventListener(
    "click",
    function() {


        hideAll();

        hideStatus();


        /*
           IMPORTANTE:

           Este play acontece diretamente
           dentro do clique do usuário.
        */

        playAudio(

            AUDIO.inicio,

            function() {

                showScreen(
                    "regras.png"
                );

                rulesHot.style.display =
                    "block";

            }

        );

    }
);


/* =========================================================
   REGRAS
========================================================= */

rulesHot.addEventListener(
    "click",
    function() {


        hideAll();

        showScreen(
            "entrar.png"
        );


        nameBox.style.display =
            "block";


        enterHot.style.display =
            "block";


        nameBox.focus();


        playAudio(
            AUDIO.participante
        );

    }
);


/* =========================================================
   ENTRAR
========================================================= */

enterHot.addEventListener(
    "click",
    submitName
);


nameBox.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            submitName();

        }

    }
);


function submitName() {


    const name =
        nameBox.value.trim();


    if (!name) {

        nameBox.focus();

        return;

    }


    localStorage.setItem(
        "trilhar_player_name",
        name
    );


    hideAll();


    playAudio(

        AUDIO.boaSorte,

        function() {

            showValueScreen(0);

        }

    );

}


/* =========================================================
   VALOR
========================================================= */

function showValueScreen(index) {


    stopAudio();

    hideAll();


    currentQuestion =
        index;


    showScreen(
        VALUES[index]
    );


    playAudio(

        getValueAudio(index),

        function() {

            showQuestion(index);

        }

    );

}


/* =========================================================
   PERGUNTA
========================================================= */

function showQuestion(index) {


    stopAudio();

    hideAll();


    answering =
        false;


    showScreen(
        QUESTIONS[index]
    );


    answerButtons.forEach(
        function(button) {

            button.style.display =
                "block";

            button.style.pointerEvents =
                "auto";

        }
    );


    playAudio(
        AUDIO.suspense
    );

}


/* =========================================================
   RESPOSTAS
========================================================= */

answerButtons.forEach(
    function(button,index) {

        button.addEventListener(
            "click",
            function() {

                answer(
                    index + 1
                );

            }
        );

    }
);


/* =========================================================
   RESPONDER
========================================================= */

function answer(selected) {


    if (answering) {

        return;

    }


    answering =
        true;


    answerButtons.forEach(
        function(button) {

            button.style.pointerEvents =
                "none";

        }
    );


    stopAudio();


    const correct =
        CORRECT[currentQuestion];


    /* =====================================================
       ACERTO
    ===================================================== */

    if (
        selected === correct
    ) {


        playAudio(

            AUDIO.certa,

            function() {


                /*
                   Última pergunta.
                */

                if (
                    currentQuestion === 9
                ) {

                    showFinal();

                    return;

                }


                currentQuestion++;


                showValueScreen(
                    currentQuestion
                );

            }

        );


        return;

    }


    /* =====================================================
       ERRO
    ===================================================== */

    playAudio(

        AUDIO.errada,

        function() {


            hideAll();


            showScreen(
                "perdeu.png"
            );


            playAudio(

                AUDIO.moeda,

                function() {


                    /*
                       Retorna para a
                       mesma pergunta.
                    */

                    showQuestion(
                        currentQuestion
                    );

                }

            );

        }

    );

}


/* =========================================================
   FINAL
========================================================= */

function showFinal() {


    stopAudio();

    hideAll();

    hideStatus();


    showScreen(
        "parabens.png"
    );


    playAudio(
        AUDIO.final
    );

}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

showStart();


/*
   Começa a localizar os MP3
   imediatamente.

   Não tenta reproduzir nada
   automaticamente.
*/

loadAudioFiles();

</script>

</body>

</html>
