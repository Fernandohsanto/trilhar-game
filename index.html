<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guima Show — Trilhar</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#game{
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

#stage{
    position:relative;
    width:min(100vw,177.7778vh);
    aspect-ratio:16/9;
    max-height:100vh;
}

#screen{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:fill;
    display:block;
    user-select:none;
}

.hot{
    position:absolute;
    border:0;
    background:transparent;
    cursor:pointer;
    z-index:10;
    padding:0;
}

/* JOGAR */
#playHot{
    left:25%;
    top:70%;
    width:50%;
    height:25%;
}

/* REGRAS */
#rulesHot{
    inset:0;
}

/* ENTRAR */
#enterHot{
    left:69%;
    top:20%;
    width:25%;
    height:18%;
}

/* VOLTAR */
#backHot{
    left:69%;
    top:55%;
    width:25%;
    height:18%;
}

/* RESPOSTAS */
#answerA{
    left:7.5%;
    top:38.8%;
    width:43.8%;
    height:6.5%;
}

#answerB{
    left:7.5%;
    top:47%;
    width:43.8%;
    height:6.5%;
}

#answerC{
    left:7.5%;
    top:55.2%;
    width:43.8%;
    height:6.5%;
}

#answerD{
    left:7.5%;
    top:63.3%;
    width:43.8%;
    height:6.5%;
}

/* NOME */
#nameBox{
    position:absolute;
    left:29%;
    top:65%;
    width:42%;
    z-index:20;
    display:none;
}

#nameInput{
    width:100%;
    height:58px;
    border:3px solid #b8d99c;
    border-radius:12px;
    padding:0 18px;
    font-size:28px;
    text-align:center;
    outline:none;
    background:rgba(255,255,255,.96);
    color:#1b1b1b;
}

#nameHint{
    margin-top:7px;
    text-align:center;
    color:#fff;
    font-size:17px;
    text-shadow:0 2px 4px #000;
}

/* CONTINUAR */
#continueOverlay{
    position:absolute;
    inset:0;
    z-index:9;
    display:none;
    cursor:pointer;
}

/* MENSAGEM */
#message{
    position:fixed;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    background:rgba(0,0,0,.8);
    color:#fff;
    padding:10px 16px;
    border-radius:8px;
    font-size:15px;
    display:none;
    z-index:100;
    text-align:center;
    max-width:90%;
}

@media(max-width:700px){

    #nameInput{
        height:46px;
        font-size:20px;
    }

    #nameHint{
        font-size:13px;
    }
}
</style>
</head>

<body>

<div id="game">

<div id="stage">

<img
    id="screen"
    src="inicio.png"
    alt="Guima Show"
>

<button
    id="playHot"
    class="hot">
</button>

<button
    id="rulesHot"
    class="hot">
</button>

<button
    id="enterHot"
    class="hot">
</button>

<button
    id="backHot"
    class="hot">
</button>

<div id="continueOverlay"></div>

<div id="nameBox">

<input
    id="nameInput"
    type="text"
    maxlength="32"
    autocomplete="name"
    placeholder="Digite seu nome"
>

<div id="nameHint">
Digite seu nome e clique em ENTRAR
</div>

</div>

<button
    id="answerA"
    class="hot">
</button>

<button
    id="answerB"
    class="hot">
</button>

<button
    id="answerC"
    class="hot">
</button>

<button
    id="answerD"
    class="hot">
</button>

</div>
</div>

<div id="message"></div>


<script>

/* =====================================================
   ÁUDIOS
   ===================================================== */

const audio = {

    start:
        "Vai começar o show do milhão.mp3",

    participant:
        "Vamos conhecer o nosso participante.mp3",

    lucky:
        "Boa Sorte.mp3",

    suspense:
        "Musica suspense de perguntas.mp3",

    correct:
        "certa resposta.mp3",

    wrong:
        "Que pena vc errou.mp3",

    coin:
        "Moeda caindo quando perde.mp3",

    values:[

        "1 Mil.mp3",

        "5 mil.mp3",

        "10 mil.mp3",

        "30 mil.mp3",

        "50 mil.mp3",

        "1000 mil.mp3",

        "2000 mil.mp3",

        "4000 mil.mp3",

        "5000 mil.mp3",

        "1 milhão.mp3"

    ],

    final:
        "Parabéns vc ganhou 1milhão de reais.mp3"
};


/* =====================================================
   TELAS
   ===================================================== */

const screens = {

    start:
        "inicio.png",

    rules:
        "regras.png",

    enter:
        "entrar.png",

    lost:
        "perdeu.png",

    final:
        "parabens.png",

    values:[

        "valor-1k.png",
        "valor-5k.png",
        "valor-10k.png",
        "valor-30k.png",
        "valor-50k.png",
        "valor-100k.png",
        "valor-200k.png",
        "valor-400k.png",
        "valor-500k.png",
        "valor-1m.png"

    ],

    questions:[

        "pergunta-1.png",
        "pergunta-2.png",
        "pergunta-3.png",
        "pergunta-4.png",
        "pergunta-5.png",
        "pergunta-6.png",
        "pergunta-7.png",
        "pergunta-8.png",
        "pergunta-9.png",
        "pergunta-10.png"

    ]
};


/* =====================================================
   RESPOSTAS CORRETAS
   ===================================================== */

const correct = [
    1,
    4,
    2,
    2,
    3,
    4,
    2,
    3,
    4,
    4
];


/* =====================================================
   VARIÁVEIS
   ===================================================== */

let current = 0;

let state = "start";

let busy = false;

let currentAudio = null;

let audioToken = 0;


/* =====================================================
   ELEMENTOS
   ===================================================== */

const screen =
    document.getElementById("screen");

const nameBox =
    document.getElementById("nameBox");

const nameInput =
    document.getElementById("nameInput");

const playHot =
    document.getElementById("playHot");

const rulesHot =
    document.getElementById("rulesHot");

const enterHot =
    document.getElementById("enterHot");

const backHot =
    document.getElementById("backHot");

const continueOverlay =
    document.getElementById("continueOverlay");

const answers = [

    document.getElementById("answerA"),
    document.getElementById("answerB"),
    document.getElementById("answerC"),
    document.getElementById("answerD")

];


/* =====================================================
   CAMINHO
   ===================================================== */

function path(file){

    return encodeURI(file);

}


/* =====================================================
   MENSAGEM
   ===================================================== */

function showMessage(text){

    const m =
        document.getElementById("message");

    m.textContent = text;

    m.style.display = "block";

    setTimeout(function(){

        m.style.display = "none";

    },4000);

}


/* =====================================================
   PARAR ÁUDIO
   ===================================================== */

function stopAudio(){

    if(currentAudio){

        currentAudio.pause();

        currentAudio.currentTime = 0;

        currentAudio = null;

    }

    audioToken++;

}


/* =====================================================
   TOCAR ÁUDIO
   ===================================================== */

function play(file,onEnd){

    stopAudio();

    const token = audioToken;

    const src = path(file);

    const a = new Audio();

    a.preload = "auto";

    a.src = src;

    currentAudio = a;


    a.addEventListener(
        "ended",
        function(){

            if(token !== audioToken){
                return;
            }

            currentAudio = null;

            if(onEnd){
                onEnd();
            }

        }
    );


    a.addEventListener(
        "error",
        function(){

            if(token !== audioToken){
                return;
            }

            currentAudio = null;

            console.error(
                "Erro ao carregar áudio:",
                src
            );

            showMessage(
                "Não foi possível carregar o áudio: " +
                file
            );

            /*
               Mesmo se o áudio falhar,
               o jogo continua.
            */

            if(onEnd){
                onEnd();
            }

        }
    );


    const promise = a.play();

    if(promise !== undefined){

        promise.catch(function(error){

            console.warn(
                "Autoplay bloqueado:",
                error
            );

            /*
               O áudio será liberado
               no próximo toque.
            */

        });

    }

    return a;
}


/* =====================================================
   ESCONDER ELEMENTOS
   ===================================================== */

function hideAll(){

    playHot.style.display = "none";

    rulesHot.style.display = "none";

    enterHot.style.display = "none";

    backHot.style.display = "none";

    continueOverlay.style.display = "none";

    nameBox.style.display = "none";

    answers.forEach(function(button){

        button.style.display = "none";

    });

}


/* =====================================================
   TROCAR TELA
   ===================================================== */

function setScreen(file){

    screen.src = path(file);

}


/* =====================================================
   INÍCIO
   ===================================================== */

function showStart(){

    state = "start";

    busy = false;

    hideAll();

    setScreen(
        screens.start
    );

    playHot.style.display = "block";

    play(
        audio.start
    );

}


/* =====================================================
   REGRAS
   ===================================================== */

function showRules(){

    state = "rules";

    busy = false;

    hideAll();

    setScreen(
        screens.rules
    );

    continueOverlay.style.display = "block";

}


/* =====================================================
   ENTRAR
   ===================================================== */

function showEnter(){

    state = "enter";

    busy = false;

    hideAll();

    setScreen(
        screens.enter
    );

    enterHot.style.display = "block";

    backHot.style.display = "block";

    nameBox.style.display = "block";

    nameInput.focus();

    play(
        audio.participant
    );

}


/* =====================================================
   NOME
   ===================================================== */

function submitName(){

    if(busy){
        return;
    }

    const name =
        nameInput.value.trim();

    if(!name){

        nameInput.focus();

        showMessage(
            "Digite seu nome primeiro."
        );

        return;

    }

    localStorage.setItem(
        "guimaShowNome",
        name
    );

    busy = true;

    play(
        audio.lucky,
        showValuesFirst
    );

}


/* =====================================================
   PRIMEIRO VALOR
   ===================================================== */

function showValuesFirst(){

    current = 0;

    state = "value";

    busy = true;

    hideAll();

    setScreen(
        screens.values[0]
    );

    play(
        audio.values[0],
        showQuestion
    );

}


/* =====================================================
   PRÓXIMO VALOR
   ===================================================== */

function showValuesFor(index){

    state = "value";

    busy = true;

    hideAll();

    setScreen(
        screens.values[index]
    );

    play(
        audio.values[index],
        showQuestion
    );

}


/* =====================================================
   PERGUNTA
   ===================================================== */

function showQuestion(){

    state = "question";

    busy = false;

    hideAll();

    setScreen(
        screens.questions[current]
    );

    answers.forEach(function(button){

        button.style.display = "block";

    });

    play(
        audio.suspense
    );

}


/* =====================================================
   RESPOSTA
   ===================================================== */

function answer(number){

    if(
        state !== "question" ||
        busy
    ){
        return;
    }

    busy = true;

    stopAudio();


    /* ================================================
       ACERTO
       ================================================ */

    if(
        number === correct[current]
    ){

        play(
            audio.correct,
            function(){

                /*
                   PERGUNTA 10
                */

                if(current === 9){

                    state = "final";

                    hideAll();

                    setScreen(
                        screens.final
                    );

                    play(
                        audio.final
                    );

                    busy = false;

                    return;

                }


                /*
                   PRÓXIMO VALOR
                */

                current++;

                showValuesFor(
                    current
                );

            }
        );

        return;
    }


    /* ================================================
       ERRO
       ================================================ */

    play(
        audio.wrong,
        function(){

            state = "lost";

            hideAll();

            setScreen(
                screens.lost
            );

            play(
                audio.coin,
                function(){

                    /*
                       VOLTA PARA A MESMA
                       PERGUNTA.
                    */

                    showQuestion();

                }
            );

        }
    );

}


/* =====================================================
   BOTÃO JOGAR
   ===================================================== */

playHot.onclick = function(){

    if(state !== "start"){
        return;
    }

    stopAudio();

    showRules();

};


/* =====================================================
   REGRAS
   ===================================================== */

rulesHot.onclick = function(){

    if(state === "rules"){

        showEnter();

    }

};


continueOverlay.onclick = function(){

    if(state === "rules"){

        showEnter();

    }

};


/* =====================================================
   ENTRAR
   ===================================================== */

enterHot.onclick = function(){

    if(state === "enter"){

        submitName();

    }

};


/* =====================================================
   VOLTAR
   ===================================================== */

backHot.onclick = function(){

    if(state === "enter"){

        stopAudio();

        showStart();

    }

};


/* =====================================================
   RESPOSTAS
   ===================================================== */

answers[0].onclick = function(){
    answer(1);
};

answers[1].onclick = function(){
    answer(2);
};

answers[2].onclick = function(){
    answer(3);
};

answers[3].onclick = function(){
    answer(4);
};


/* =====================================================
   ENTER NO NOME
   ===================================================== */

nameInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            submitName();

        }

    }
);


/* =====================================================
   LIBERAR ÁUDIO
   ===================================================== */

document.addEventListener(
    "pointerdown",
    function(){

        if(
            currentAudio &&
            currentAudio.paused
        ){

            currentAudio
                .play()
                .catch(function(){});

        }

    }
);


/* =====================================================
   INICIAR
   ===================================================== */

showStart();

</script>

</body>
</html>
